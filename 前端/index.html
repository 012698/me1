function StatsView({ data }) {
  const visits = data.visits || [];
  const total = visits.length;
  const today = new Date().toISOString().split('T')[0];
  const todayVisits = visits.filter(v=>v.date===today).length;
  const dates = [...new Set(visits.map(v=>v.date))];
  const avg = dates.length > 0 ? Math.round(total/dates.length*10)/10 : 0;
  const last30 = [];
  for (let i=29; i>=0; i--) { const d = new Date(); d.setDate(d.getDate()-i); const ds = d.toISOString().split('T')[0]; last30.push({ date: ds, count: visits.filter(v=>v.date===ds).length }); }
  const maxCount = Math.max(...last30.map(d=>d.count), 1);
  return (
    <div>
      <div className="grid grid-cols-3 gap-4 mb-8">
        {[{ label: '总访问量', value: total }, { label: '今日访问', value: todayVisits }, { label: '日均访问', value: avg }].map((s,i) => (
          <div key={i} className="text-center p-5 rounded-xl bg-gray-50/80 dark:bg-gray-700/30 border border-gray-100/50 dark:border-gray-700/30">
            <div className="text-3xl font-extrabold gradient-text">{s.value}</div>
            <div className="text-sm text-gray-400 mt-1 font-medium">{s.label}</div>
          </div>
        ))}
      </div>
      <h3 className="font-bold mb-4">最近30天趋势</h3>
      <div className="flex items-end gap-0.5 h-32 mb-2">
        {last30.map((d,i)=>(<div key={i} className="flex-1 bg-gradient-to-t from-accent to-accent-light rounded-t hover:opacity-80 transition" style={{height:`${(d.count/maxCount)*100}%`, minHeight:'2px'}} title={`${d.date}: ${d.count}次`}></div>))}
      </div>
      <div className="flex justify-between text-xs text-gray-400"><span>{last30[0]?.date}</span><span>{last30[last30.length-1]?.date}</span></div>
    </div>
  );
}

// ==================== 文件存储管理（管理员） ====================
function FileStorageEditor({ fileStorage, setFileStorage }) {
  const [newFolderName, setNewFolderName] = useState('');
  const [newFolderParent, setNewFolderParent] = useState('root');
  const [uploadFolderId, setUploadFolderId] = useState('root');
  const [uploadFile, setUploadFile] = useState(null);
  const [uploading, setUploading] = useState(false);

  const folders = fileStorage.folders || [];
  const files = fileStorage.files || [];

  function formatFileSize(bytes) {
    if (!bytes) return '0 B';
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    return (bytes / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
  }

  function addFolder() {
    if (!newFolderName.trim()) { alert('请输入文件夹名称'); return; }
    const newFS = { ...fileStorage, folders: [...folders, { id: 'folder_' + Date.now(), name: newFolderName.trim(), parentId: newFolderParent }] };
    setFileStorage(newFS);
    saveFileStorage(newFS);
    setNewFolderName('');
  }

  function deleteFolder(id) {
    if (id === 'root') { alert('不能删除根目录'); return; }
    if (!confirm('确定删除此文件夹？文件夹内的文件也会被删除。')) return;
    // 递归获取所有子文件夹 ID
    function getSubfolderIds(parentId) {
      const ids = [parentId];
      folders.filter(f => f.parentId === parentId).forEach(f => ids.push(...getSubfolderIds(f.id)));
      return ids;
    }
    const deleteIds = getSubfolderIds(id);
    const newFS = { ...fileStorage, folders: folders.filter(f => !deleteIds.includes(f.id)), files: files.filter(f => !deleteIds.includes(f.folderId)) };
    setFileStorage(newFS);
    saveFileStorage(newFS);
  }

  function handleUpload() {
    if (!uploadFile) { alert('请选择文件'); return; }
    setUploading(true);
    const reader = new FileReader();
    reader.onload = function(ev) {
      const newFile = {
        id: 'file_' + Date.now(),
        name: uploadFile.name,
        type: uploadFile.type,
        size: uploadFile.size,
        data: ev.target.result,
        folderId: uploadFolderId,
        uploadDate: new Date().toISOString(),
        uploadedBy: '管理员'
      };
      const newFS = { ...fileStorage, files: [...files, newFile] };
      setFileStorage(newFS);
      saveFileStorage(newFS);
      setUploadFile(null);
      setUploading(false);
    };
    reader.onerror = function() { alert('文件读取失败'); setUploading(false); };
    reader.readAsDataURL(uploadFile);
  }

  function deleteFile(id) {
    if (!confirm('确定删除此文件？')) return;
    const newFS = { ...fileStorage, files: files.filter(f => f.id !== id) };
    setFileStorage(newFS);
    saveFileStorage(newFS);
  }

  function moveFile(fileId, targetFolderId) {
    const newFS = { ...fileStorage, files: files.map(f => f.id === fileId ? { ...f, folderId: targetFolderId } : f) };
    setFileStorage(newFS);
    saveFileStorage(newFS);
  }

  function getFolderPath(folderId) {
    const path = [];
    let fid = folderId;
    while (fid) {
      const f = folders.find(f => f.id === fid);
      if (f) { path.unshift(f.name); fid = f.parentId; } else break;
    }
    return path.join(' / ');
  }

  return (
    <div>
      {/* 创建文件夹 */}
      <h3 className="font-bold mb-4">📁 文件夹管理 ({folders.length})</h3>
      <div className="flex gap-2 mb-4 flex-wrap">
        <input value={newFolderName} onChange={e=>setNewFolderName(e.target.value)} placeholder="文件夹名称"
          className="px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-700/80 text-sm flex-1 min-w-[160px] focus:ring-2 focus:ring-accent/40 outline-none" />
        <select value={newFolderParent} onChange={e=>setNewFolderParent(e.target.value)}
          className="px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-700/80 text-sm focus:ring-2 focus:ring-accent/40 outline-none">
          {folders.map(f => <option key={f.id} value={f.id}>{f.id === 'root' ? '根目录' : f.name}</option>)}
        </select>
        <Button size="sm" onClick={addFolder}>创建文件夹</Button>
      </div>
      <div className="space-y-2 mb-8">
        {folders.filter(f => f.id !== 'root').map(f => (
          <div key={f.id} className="flex justify-between items-center py-2.5 px-4 rounded-xl bg-gray-50/80 dark:bg-gray-700/30 border border-gray-100/50 dark:border-gray-700/30">
            <div className="flex items-center gap-3">
              <span className="text-lg">📁</span>
              <div>
                <div className="font-semibold text-sm">{f.name}</div>
                <div className="text-xs text-gray-400">{getFolderPath(f.parentId)} · {files.filter(sf => sf.folderId === f.id).length} 文件</div>
              </div>
            </div>
            <button onClick={()=>deleteFolder(f.id)} className="text-red-500 text-sm font-medium hover:underline">删除</button>
          </div>
        ))}
      </div>

      {/* 上传文件 */}
      <h3 className="font-bold mb-4">📄 文件管理 ({files.length})</h3>
      <div className="flex gap-2 mb-4 flex-wrap items-end">
        <div className="flex-1 min-w-[200px]">
          <label className="block text-xs font-semibold mb-1.5 text-gray-500">选择上传文件</label>
          <input type="file" onChange={e=>setUploadFile(e.target.files[0] || null)}
            className="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-700/80 text-sm file:mr-3 file:py-1 file:px-3 file:rounded-lg file:border-0 file:bg-accent/10 file:text-accent file:font-medium file:text-xs" />
        </div>
        <div>
          <label className="block text-xs font-semibold mb-1.5 text-gray-500">上传到</label>
          <select value={uploadFolderId} onChange={e=>setUploadFolderId(e.target.value)}
            className="px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-700/80 text-sm focus:ring-2 focus:ring-accent/40 outline-none">
            {folders.map(f => <option key={f.id} value={f.id}>{f.id === 'root' ? '根目录' : f.name}</option>)}
          </select>
        </div>
        <Button size="sm" onClick={handleUpload} disabled={uploading}>{uploading ? '上传中...' : '上传'}</Button>
      </div>
      {uploadFile && <p className="text-xs text-gray-400 mb-4">待上传: {uploadFile.name} ({formatFileSize(uploadFile.size)})</p>}

      <div className="space-y-2">
        {files.map(f => (
          <div key={f.id} className="flex justify-between items-center py-2.5 px-4 rounded-xl bg-gray-50/80 dark:bg-gray-700/30 border border-gray-100/50 dark:border-gray-700/30">
            <div className="flex items-center gap-3 min-w-0 flex-1">
              <span className="text-lg flex-shrink-0">📄</span>
              <div className="min-w-0">
                <div className="font-semibold text-sm truncate">{f.name}</div>
                <div className="text-xs text-gray-400">{formatFileSize(f.size)} · {getFolderPath(f.folderId)} · {f.uploadDate ? new Date(f.uploadDate).toLocaleDateString('zh-CN') : ''}</div>
              </div>
            </div>
            <div className="flex items-center gap-2 flex-shrink-0">
              <select value={f.folderId} onChange={e=>moveFile(f.id, e.target.value)}
                className="px-2 py-1 rounded-lg border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-700/80 text-xs focus:ring-1 focus:ring-accent/40 outline-none">
                {folders.map(folder => <option key={folder.id} value={folder.id}>{folder.id === 'root' ? '根目录' : folder.name}</option>)}
              </select>
              <button onClick={()=>deleteFile(f.id)} className="text-red-500 text-sm font-medium hover:underline">删除</button>
            </div>
          </div>
        ))}
        {files.length === 0 && <p className="text-center text-gray-400 py-8 text-sm">暂无文件，上传文件或审核网友提交即可</p>}
      </div>
    </div>
  );
}

// ==================== 文件提交审核（管理员） ====================
function FileSubmissionReview({ fileSubmissions, setFileSubmissions, fileStorage, setFileStorage }) {
  const [filter, setFilter] = useState('pending');

  function formatFileSize(bytes) {
    if (!bytes) return '0 B';
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    return (bytes / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
  }

  function approveSubmission(id) {
    const sub = fileSubmissions.find(s => s.id === id);
    if (!sub) return;
    // 将文件添加到文件存储
    const folders = fileStorage.folders || [];
    const targetFolderId = folders.find(f => f.id === sub.targetFolderId) ? sub.targetFolderId : 'root';
    const newFile = {
      id: 'file_' + Date.now(),
      name: sub.fileName,
      type: sub.fileType,
      size: sub.fileSize,
      data: sub.fileData,
      folderId: targetFolderId,
      uploadDate: new Date().toISOString(),
      uploadedBy: sub.submitterName + '（网友提交）'
    };
    const newFS = { ...fileStorage, files: [...(fileStorage.files || []), newFile] };
    setFileStorage(newFS);
    saveFileStorage(newFS);
    // 更新提交状态
    const newSubs = fileSubmissions.map(s => s.id === id ? { ...s, status: 'approved', approvedDate: new Date().toISOString() } : s);
    setFileSubmissions(newSubs);
    saveFileSubmissions(newSubs);
  }

  function rejectSubmission(id) {
    const reason = prompt('拒绝原因（可选）：') || '';
    const newSubs = fileSubmissions.map(s => s.id === id ? { ...s, status: 'rejected', rejectedDate: new Date().toISOString(), rejectReason: reason } : s);
    setFileSubmissions(newSubs);
    saveFileSubmissions(newSubs);
  }

  function deleteSubmission(id) {
    if (!confirm('确定删除此提交记录？')) return;
    const newSubs = fileSubmissions.filter(s => s.id !== id);
    setFileSubmissions(newSubs);
    saveFileSubmissions(newSubs);
  }

  const filtered = fileSubmissions.filter(s => filter === 'all' || s.status === filter);
  const pendingCount = fileSubmissions.filter(s => s.status === 'pending').length;
  const approvedCount = fileSubmissions.filter(s => s.status === 'approved').length;
  const rejectedCount = fileSubmissions.filter(s => s.status === 'rejected').length;

  const statusConfig = {
    pending: { label: '⏳ 待审核', color: 'blue' },
    approved: { label: '✅ 已通过', color: 'green' },
    rejected: { label: '❌ 已拒绝', color: 'red' }
  };

  const folders = fileStorage.folders || [];

  return (
    <div>
      <div className="flex gap-2 mb-5 flex-wrap">
        <button onClick={()=>setFilter('pending')} className={`px-4 py-2 rounded-xl text-sm font-semibold transition ${filter==='pending'?'bg-gradient-to-r from-blue-500 to-blue-600 text-white shadow-sm':'bg-gray-100/80 dark:bg-gray-700/50'}`}>
          ⏳ 待审核 ({pendingCount})
        </button>
        <button onClick={()=>setFilter('approved')} className={`px-4 py-2 rounded-xl text-sm font-semibold transition ${filter==='approved'?'bg-gradient-to-r from-emerald-500 to-emerald-600 text-white shadow-sm':'bg-gray-100/80 dark:bg-gray-700/50'}`}>
          ✅ 已通过 ({approvedCount})
        </button>
        <button onClick={()=>setFilter('rejected')} className={`px-4 py-2 rounded-xl text-sm font-semibold transition ${filter==='rejected'?'bg-gradient-to-r from-red-500 to-red-600 text-white shadow-sm':'bg-gray-100/80 dark:bg-gray-700/50'}`}>
          ❌ 已拒绝 ({rejectedCount})
        </button>
        <button onClick={()=>setFilter('all')} className={`px-4 py-2 rounded-xl text-sm font-semibold transition ${filter==='all'?'bg-gradient-to-r from-accent to-accent-dark text-white shadow-sm':'bg-gray-100/80 dark:bg-gray-700/50'}`}>
          全部 ({fileSubmissions.length})
        </button>
      </div>

      {filtered.length === 0 ? (
        <div className="text-center py-16 text-gray-400">
          <div className="text-5xl mb-3">📋</div>
          <p>{filter === 'pending' ? '没有待审核的提交' : filter === 'all' ? '还没有任何提交' : '没有' + (filter === 'approved' ? '已通过的' : '已拒绝的') + '提交'}</p>
        </div>
      ) : (
        <div className="space-y-3">
          {filtered.map(s => {
            const sc = statusConfig[s.status] || statusConfig.pending;
            const targetFolder = folders.find(f => f.id === s.targetFolderId);
            return (
              <div key={s.id} className="glass rounded-2xl border border-white/30 dark:border-gray-700/50 p-5 card-hover">
                <div className="flex justify-between items-start mb-3">
                  <div className="flex items-center gap-3">
                    <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-accent/15 to-purple-500/15 flex items-center justify-center text-lg">📄</div>
                    <div>
                      <div className="font-semibold">{s.fileName}</div>
                      <div className="text-xs text-gray-400 mt-0.5">
                        {formatFileSize(s.fileSize)} · 提交者: {s.submitterName} · {new Date(s.submitDate).toLocaleDateString('zh-CN')}
                      </div>
                    </div>
                  </div>
                  <Badge color={sc.color}>{sc.label}</Badge>
                </div>
                {s.description && <p className="text-sm text-gray-500 mb-2 pl-13">💬 {s.description}</p>}
                <div className="text-xs text-gray-400 mb-3">
                  📁 目标文件夹: {targetFolder ? (targetFolder.id === 'root' ? '根目录' : targetFolder.name) : '根目录'}
                </div>
                {s.status === 'rejected' && s.rejectReason && (
                  <div className="text-xs text-red-500 mb-3">拒绝原因: {s.rejectReason}</div>
                )}
                {s.status === 'approved' && s.approvedDate && (
                  <div className="text-xs text-emerald-500 mb-3">通过时间: {new Date(s.approvedDate).toLocaleString('zh-CN')}</div>
                )}
                <div className="flex gap-2">
                  {s.status === 'pending' && (
                    <>
                      <Button size="sm" onClick={()=>approveSubmission(s.id)}>✅ 通过上架</Button>
                      <Button size="sm" variant="danger" onClick={()=>rejectSubmission(s.id)}>❌ 拒绝</Button>
                    </>
                  )}
                  {s.status !== 'pending' && (
                    <Button size="sm" variant="ghost" onClick={()=>deleteSubmission(s.id)} className="text-red-500">🗑️ 删除记录</Button>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// ==================== 全站登录墙 ====================
function LoginWall({ onLogin, onRegister }) {
  const [method, setMethod] = useState('username'); // username | wechat | qq | phone
  const [mode, setMode] = useState('login'); // login | register
  const [form, setForm] = useState({ username: '', password: '', displayName: '', phone: '', wechatId: '', qqId: '' });
  const [error, setError] = useState('');

  const methods = [
    { key: 'username', icon: '🔑', label: '账号密码', color: 'from-indigo-500 to-purple-500' },
    { key: 'wechat', icon: '💬', label: '微信登录', color: 'from-green-500 to-emerald-500' },
    { key: 'qq', icon: '🐧', label: 'QQ 登录', color: 'from-blue-500 to-cyan-500' },
    { key: 'phone', icon: '📱', label: '手机号登录', color: 'from-orange-500 to-amber-500' },
  ];

  function handleUsernameLogin() {
    if (!form.password) { setError('请输入密码'); return; }
    if (!form.username && form.password === 'YOUR_ADMIN_PASSWORD_HEREL') {
      onLogin({ role: 'admin', name: '管理员', loginMethod: 'password' });
      return;
    }
    if (!form.username) { setError('请输入用户名'); return; }
    const users = window._cachedUsers || [];
    const user = users.find(u => u.username === form.username && u.password === form.password);
    if (user) {
      // 检查是否被拉黑
      (async () => {
        const banned = await loadBannedUsers();
        if (banned.includes(user.username)) { setError('该账号已被管理员拉黑，无法登录'); return; }
        onLogin({ role: 'user', name: user.displayName || user.username, username: user.username, loginMethod: 'username' });
      })();
    } else {
      setError('用户名或密码错误');
    }
  }

  function handleWechatLogin() {
    if (!form.wechatId.trim()) { setError('请输入微信昵称'); return; }
    const users = window._cachedUsers || [];
    const exist = users.find(u => u.loginMethod === 'wechat' && u.wechatId === form.wechatId.trim());
    if (exist) {
      // 检查是否被拉黑
      (async () => {
        const banned = await loadBannedUsers();
        if (banned.includes(exist.username)) { setError('该账号已被管理员拉黑，无法登录'); return; }
        onLogin({ role: 'user', name: exist.displayName || exist.wechatId, username: exist.username, loginMethod: 'wechat' });
      })();
    } else {
      const newUsername = 'wx_' + form.wechatId.trim() + '_' + Date.now();
      const newUser = { username: newUsername, password: '', displayName: form.wechatId.trim(), wechatId: form.wechatId.trim(), loginMethod: 'wechat' };
      users.push(newUser);
      saveUsers(users);
      window._cachedUsers = users;
      onLogin({ role: 'user', name: form.wechatId.trim(), username: newUsername, loginMethod: 'wechat' });
    }
  }

  function handleQQLogin() {
    if (!form.qqId.trim()) { setError('请输入QQ号或昵称'); return; }
    const users = window._cachedUsers || [];
    const exist = users.find(u => u.loginMethod === 'qq' && u.qqId === form.qqId.trim());
    if (exist) {
      // 检查是否被拉黑
      (async () => {
        const banned = await loadBannedUsers();
        if (banned.includes(exist.username)) { setError('该账号已被管理员拉黑，无法登录'); return; }
        onLogin({ role: 'user', name: exist.displayName || exist.qqId, username: exist.username, loginMethod: 'qq' });
      })();
    } else {
      const newUsername = 'qq_' + form.qqId.trim() + '_' + Date.now();
      const newUser = { username: newUsername, password: '', displayName: form.qqId.trim(), qqId: form.qqId.trim(), loginMethod: 'qq' };
      users.push(newUser);
      saveUsers(users);
      window._cachedUsers = users;
      onLogin({ role: 'user', name: form.qqId.trim(), username: newUsername, loginMethod: 'qq' });
    }
  }

  function handlePhoneLogin() {
    if (!form.phone.trim()) { setError('请输入手机号'); return; }
    if (!/^1\d{10}$/.test(form.phone.trim())) { setError('请输入有效的11位手机号'); return; }
    const users = window._cachedUsers || [];
    const exist = users.find(u => u.loginMethod === 'phone' && u.phone === form.phone.trim());
    if (exist) {
      // 检查是否被拉黑
      (async () => {
        const banned = await loadBannedUsers();
        if (banned.includes(exist.username)) { setError('该账号已被管理员拉黑，无法登录'); return; }
        onLogin({ role: 'user', name: exist.displayName || exist.phone, username: exist.username, loginMethod: 'phone' });
      })();
    } else {
      const newUsername = 'ph_' + form.phone.trim() + '_' + Date.now();
      const newUser = { username: newUsername, password: '', displayName: form.phone.trim(), phone: form.phone.trim(), loginMethod: 'phone' };
      users.push(newUser);
      saveUsers(users);
      window._cachedUsers = users;
      onLogin({ role: 'user', name: form.phone.trim(), username: newUsername, loginMethod: 'phone' });
    }
  }

  function handleRegister() {
    if (!form.username || !form.password) { setError('请填写用户名和密码'); return; }
    const users = window._cachedUsers || [];
    if (users.find(u => u.username === form.username)) { setError('用户名已存在'); return; }
    users.push({ username: form.username, password: form.password, displayName: form.displayName || form.username, loginMethod: 'username' });
    saveUsers(users);
    window._cachedUsers = users;
    setError('');
    setMode('login');
    setForm(prev => ({ ...prev, password: '' }));
  }

  function handleSubmit() {
    setError('');
    if (mode === 'register') { handleRegister(); return; }
    if (method === 'username') handleUsernameLogin();
    else if (method === 'wechat') handleWechatLogin();
    else if (method === 'qq') handleQQLogin();
    else if (method === 'phone') handlePhoneLogin();
  }

  return (
    <div className="min-h-screen flex items-center justify-center p-4 relative overflow-hidden" style={{ background: 'linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%)' }}>
      {/* 装饰背景 */}
      <div className="absolute top-[-20%] right-[-10%] w-[600px] h-[600px] rounded-full opacity-20" style={{ background: 'radial-gradient(circle, #6366f1, transparent)' }}></div>
      <div className="absolute bottom-[-20%] left-[-10%] w-[500px] h-[500px] rounded-full opacity-15" style={{ background: 'radial-gradient(circle, #8b5cf6, transparent)' }}></div>
      <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] rounded-full opacity-10" style={{ background: 'radial-gradient(circle, #a78bfa, transparent)' }}></div>

      <div className="w-full max-w-md relative z-10 fade-in">
        {/* Logo */}
        <div className="text-center mb-8">
          <div className="w-20 h-20 rounded-3xl bg-gradient-to-br from-accent to-purple-600 flex items-center justify-center text-4xl mx-auto mb-5 shadow-2xl shadow-accent/30 animate-pulse">
            👨‍💻
          </div>
          <h1 className="text-3xl font-black text-white mb-2">欢迎来到个人网站</h1>
          <p className="text-gray-400 text-sm">请登录后使用全部功能</p>
        </div>

        {/* 登录方式选择 */}
        <div className="grid grid-cols-4 gap-2 mb-6">
          {methods.map(m => (
            <button key={m.key} onClick={() => { setMethod(m.key); setError(''); }}
              className={`flex flex-col items-center gap-1.5 py-3 px-2 rounded-xl transition-all duration-300 ${method === m.key ? 'glass border-2 border-white/30 shadow-lg scale-105' : 'border border-white/10 hover:border-white/20 opacity-60 hover:opacity-80'}`}>
              <span className="text-2xl">{m.icon}</span>
              <span className={`text-xs font-semibold ${method === m.key ? 'text-white' : 'text-gray-400'}`}>{m.label}</span>
              {method === m.key && <div className={`h-0.5 w-8 rounded-full bg-gradient-to-r ${m.color}`}></div>}
            </button>
          ))}
        </div>

        {/* 表单卡片 */}
        <div className="glass rounded-2xl p-6 border border-white/20 shadow-xl">
          {mode === 'login' && method === 'username' && (
            <div className="space-y-4 fade-in">
              <div>
                <label className="text-sm font-semibold text-gray-300 mb-1.5 block">用户名</label>
                <input value={form.username} onChange={e => setForm({ ...form, username: e.target.value })}
                  placeholder="管理员留空直接输密码" className="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-gray-500 focus:ring-2 focus:ring-accent/50 focus:border-accent/50 outline-none text-sm" />
              </div>
              <div>
                <label className="text-sm font-semibold text-gray-300 mb-1.5 block">密码</label>
                <input type="password" value={form.password} onChange={e => setForm({ ...form, password: e.target.value })}
                  placeholder="输入密码" className="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-gray-500 focus:ring-2 focus:ring-accent/50 focus:border-accent/50 outline-none text-sm" />
              </div>
            </div>
          )}

          {mode === 'login' && method === 'wechat' && (
            <div className="space-y-4 fade-in">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-10 h-10 rounded-xl bg-green-500/20 flex items-center justify-center text-xl">💬</div>
                <div><p className="text-white font-semibold text-sm">微信快捷登录</p><p className="text-gray-400 text-xs">输入微信昵称即可登录</p></div>
              </div>
              <div>
                <label className="text-sm font-semibold text-gray-300 mb-1.5 block">微信昵称</label>
                <input value={form.wechatId} onChange={e => setForm({ ...form, wechatId: e.target.value })}
                  placeholder="输入你的微信昵称" className="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-gray-500 focus:ring-2 focus:ring-green-500/50 focus:border-green-500/50 outline-none text-sm" />
              </div>
            </div>
          )}

          {mode === 'login' && method === 'qq' && (
            <div className="space-y-4 fade-in">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-10 h-10 rounded-xl bg-blue-500/20 flex items-center justify-center text-xl">🐧</div>
                <div><p className="text-white font-semibold text-sm">QQ 快捷登录</p><p className="text-gray-400 text-xs">输入QQ号或昵称即可登录</p></div>
              </div>
              <div>
                <label className="text-sm font-semibold text-gray-300 mb-1.5 block">QQ号 / 昵称</label>
                <input value={form.qqId} onChange={e => setForm({ ...form, qqId: e.target.value })}
                  placeholder="输入QQ号或昵称" className="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-gray-500 focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500/50 outline-none text-sm" />
              </div>
            </div>
          )}

          {mode === 'login' && method === 'phone' && (
            <div className="space-y-4 fade-in">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-10 h-10 rounded-xl bg-orange-500/20 flex items-center justify-center text-xl">📱</div>
                <div><p className="text-white font-semibold text-sm">手机号登录</p><p className="text-gray-400 text-xs">输入手机号即可登录</p></div>
              </div>
              <div>
                <label className="text-sm font-semibold text-gray-300 mb-1.5 block">手机号</label>
                <input value={form.phone} onChange={e => setForm({ ...form, phone: e.target.value })}
                  placeholder="输入11位手机号" maxLength="11" className="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-gray-500 focus:ring-2 focus:ring-orange-500/50 focus:border-orange-500/50 outline-none text-sm" />
              </div>
            </div>
          )}

          {mode === 'register' && (
            <div className="space-y-4 fade-in">
              <div>
                <label className="text-sm font-semibold text-gray-300 mb-1.5 block">用户名</label>
                <input value={form.username} onChange={e => setForm({ ...form, username: e.target.value })}
                  placeholder="设置用户名" className="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-gray-500 focus:ring-2 focus:ring-accent/50 focus:border-accent/50 outline-none text-sm" />
              </div>
              <div>
                <label className="text-sm font-semibold text-gray-300 mb-1.5 block">显示名称</label>
                <input value={form.displayName} onChange={e => setForm({ ...form, displayName: e.target.value })}
                  placeholder="可选，默认用用户名" className="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-gray-500 focus:ring-2 focus:ring-accent/50 focus:border-accent/50 outline-none text-sm" />
              </div>
              <div>
                <label className="text-sm font-semibold text-gray-300 mb-1.5 block">密码</label>
                <input type="password" value={form.password} onChange={e => setForm({ ...form, password: e.target.value })}
                  placeholder="设置密码" className="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-gray-500 focus:ring-2 focus:ring-accent/50 focus:border-accent/50 outline-none text-sm" />
              </div>
            </div>
          )}

          {error && <p className="text-red-400 text-sm mt-3 font-medium flex items-center gap-1">⚠️ {error}</p>}

          <button onClick={handleSubmit}
            className={`w-full mt-5 py-3 rounded-xl font-bold text-white btn-shine transition-all duration-300 ${method === 'wechat' ? 'bg-gradient-to-r from-green-500 to-emerald-500 hover:shadow-lg hover:shadow-green-500/25' : method === 'qq' ? 'bg-gradient-to-r from-blue-500 to-cyan-500 hover:shadow-lg hover:shadow-blue-500/25' : method === 'phone' ? 'bg-gradient-to-r from-orange-500 to-amber-500 hover:shadow-lg hover:shadow-orange-500/25' : 'bg-gradient-to-r from-accent to-purple-600 hover:shadow-lg hover:shadow-accent/25'}`}>
            {mode === 'register' ? '注册' : '登录'}
          </button>

          {mode === 'login' && method === 'username' && (
            <div className="text-center mt-4">
              <button onClick={() => { setMode('register'); setError(''); }} className="text-sm text-gray-400 hover:text-accent transition">还没有账号？<span className="text-accent font-semibold">立即注册</span></button>
            </div>
          )}
          {mode === 'register' && (
            <div className="text-center mt-4">
              <button onClick={() => { setMode('login'); setError(''); }} className="text-sm text-gray-400 hover:text-accent transition">已有账号？<span className="text-accent font-semibold">去登录</span></button>
            </div>
          )}
        </div>

        <p className="text-center text-xs text-gray-500 mt-6">登录即表示同意本站使用条款 · 数据存储于本地浏览器</p>
      </div>
    </div>
  );
}

function AdminLogin({ onSuccess, onClose }) {
  const [pwd, setPwd] = useState('');
  const [error, setError] = useState('');
  function handleLogin() { if (pwd === 'YOUR_ADMIN_PASSWORD_HEREL') { onSuccess(); } else { setError('密码错误！'); } }
  return (
    <Modal open={true} onClose={onClose} title="管理员登录">
      <Input label="请输入管理员密码" type="password" value={pwd} onChange={v=>{setPwd(v); setError('');}} placeholder="输入密码" />
      {error && <p className="text-red-500 text-sm mb-2 font-medium">{error}</p>}
      <div className="flex gap-3 mt-4">
        <Button className="flex-1" onClick={handleLogin}>进入后台</Button>
        <Button variant="outline" onClick={onClose}>取消</Button>
      </div>
    </Modal>
  );
}

// ==================== 主应用 ====================
function App() {
  const [loading, setLoading] = useState(true);
  const [data, setRawData] = useState(null);
  const [users, setUsers] = useState([]);
  const [chatMessages, setChatMessages] = useState([]);
  const [meetings, setMeetings] = useState([]);
  const [fileStorage, setFileStorage] = useState({ folders: [{ id: 'root', name: '根目录', parentId: null }], files: [] });
  const [fileSubmissions, setFileSubmissions] = useState([]);
  const [route, setRoute] = useState(window.location.hash.includes('school') ? 'school' : window.location.hash.includes('files') ? 'files' : window.location.hash.includes('games') ? 'games' : window.location.hash.includes('social') ? 'social' : 'home');
  const [showAdminLogin, setShowAdminLogin] = useState(false);
  const [showAdmin, setShowAdmin] = useState(false);
  const [currentUser, setCurrentUser] = useState(null);

  // 初始化加载 IndexedDB 数据 + 登录状态
  useEffect(() => {
    async function init() {
      try {
        const all = await loadAllData();
        setRawData(all.mainData);
        setUsers(all.users);
        setChatMessages(all.chatMessages);
        setMeetings(all.meetings);
        setFileStorage(all.fileStorage);
        setFileSubmissions(all.fileSubmissions);
        // 加载社交数据
        const friendData = await dbGet(FRIENDSHIPS_KEY);
        const pmData = await dbGet(PRIVATE_MSGS_KEY);
        // 缓存 users 到全局供同步访问
        window._cachedUsers = all.users;
        // 恢复登录状态
        const savedLogin = await loadLoginState();
        if (savedLogin && savedLogin.name) {
          setCurrentUser(savedLogin);
        }
      } catch (e) {
        console.error('加载数据失败:', e);
        setRawData(JSON.parse(JSON.stringify(defaultData)));
      }
      setLoading(false);
    }
    init();
  }, []);

  const setData = useCallback((newData) => {
    setRawData(newData);
    saveData(newData);
  }, []);

  // 同步 users 缓存
  useEffect(() => { window._cachedUsers = users; }, [users]);

  // 强制下线 / 拉黑检测轮询：每 5 秒检查当前用户是否被踢或被封
  useEffect(() => {
    if (!currentUser || currentUser.role === 'admin') return;
    const iv = setInterval(async () => {
      // 检查强制下线标志
      const forced = await checkForceLogout(currentUser.username);
      if (forced) {
        setCurrentUser(null);
        clearLoginState();
        return;
      }
      // 检查是否被拉黑
      const banned = await loadBannedUsers();
      if (currentUser.username && banned.includes(currentUser.username)) {
        setCurrentUser(null);
        clearLoginState();
      }
    }, 5000);
    return () => clearInterval(iv);
  }, [currentUser]);

  useTheme(data?.theme || { mode: 'light', accent: '#6366f1' });

  useEffect(() => { if (data) trackVisit(data); }, [data]);

  useEffect(() => {
    const handler = () => setRoute(window.location.hash.includes('school') ? 'school' : window.location.hash.includes('files') ? 'files' : window.location.hash.includes('games') ? 'games' : window.location.hash.includes('social') ? 'social' : 'home');
    window.addEventListener('hashchange', handler);
    return () => window.removeEventListener('hashchange', handler);
  }, []);

  function navigate(page) {
    if (page === 'school') window.location.hash = '#/school';
    else if (page === 'files') window.location.hash = '#/files';
    else if (page === 'games') window.location.hash = '#/games';
    else if (page === 'social') window.location.hash = '#/social';
    else window.location.hash = '#/';
    setRoute(page);
  }

  function handleLogin(user) {
    setCurrentUser(user);
    saveLoginState(user);
  }

  function handleLogout() {
    setCurrentUser(null);
    clearLoginState();
  }

  if (loading) {
    return (
      <div className="flex items-center justify-center min-h-screen">
        <div className="text-center">
          <div className="w-12 h-12 rounded-2xl bg-gradient-to-br from-accent to-purple-600 mx-auto mb-4 animate-pulse"></div>
          <p className="text-gray-400 text-sm font-medium">加载中...</p>
        </div>
      </div>
    );
  }

  // 未登录 → 显示登录墙，所有功能不可用
  if (!currentUser) {
    return <LoginWall onLogin={handleLogin} />;
  }

  return (
    <>
      {showAdmin ? (
        <AdminPanel data={data} setData={setData} fileStorage={fileStorage} setFileStorage={setFileStorage} fileSubmissions={fileSubmissions} setFileSubmissions={setFileSubmissions} onClose={()=>setShowAdmin(false)} />
      ) : route === 'school' ? (
        <SchoolPage data={data} setData={setData} onNavigate={navigate} currentUser={currentUser}
          onLogin={handleLogin} onLogout={handleLogout} onRegister={()=>{}}
          chatMessages={chatMessages} setChatMessages={setChatMessages}
          meetings={meetings} setMeetings={setMeetings}
        />
      ) : route === 'files' ? (
        <FileStoragePage fileStorage={fileStorage} setFileStorage={setFileStorage} fileSubmissions={fileSubmissions} setFileSubmissions={setFileSubmissions} onNavigate={navigate} currentUser={currentUser} />
      ) : route === 'games' ? (
        <GameCenter onBack={()=>navigate('home')} currentUser={currentUser} />
      ) : route === 'social' ? (
        <SocialHub currentUser={currentUser} onBack={()=>navigate('home')} users={users} />
      ) : (
        <HomePage data={data} onAdminClick={()=>setShowAdminLogin(true)} onNavigate={navigate} onClearCache={()=>window.location.reload()} currentUser={currentUser} onLogout={handleLogout} />
      )}
      {showAdminLogin && (
        <AdminLogin onSuccess={()=>{ setShowAdminLogin(false); setShowAdmin(true); }} onClose={()=>setShowAdminLogin(false)} />
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
