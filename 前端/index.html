// ==================== IndexedDB 存储层 ====================
const DB_NAME = 'PersonalWebsiteDB';
const DB_VERSION = 1;
let dbInstance = null;

function openDB() {
  return new Promise((resolve, reject) => {
    if (dbInstance) return resolve(dbInstance);
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('kvstore')) {
        db.createObjectStore('kvstore', { keyPath: 'key' });
      }
    };
    req.onsuccess = (e) => { dbInstance = e.target.result; resolve(dbInstance); };
    req.onerror = (e) => reject(e.target.error);
  });
}

async function dbGet(key) {
  try {
    const db = await openDB();
    return new Promise((resolve) => {
      const tx = db.transaction('kvstore', 'readonly');
      const req = tx.objectStore('kvstore').get(key);
      req.onsuccess = () => resolve(req.result?.value ?? null);
      req.onerror = () => resolve(null);
    });
  } catch { return null; }
}

async function dbPut(key, value) {
  try {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('kvstore', 'readwrite');
      const req = tx.objectStore('kvstore').put({ key, value });
      req.onsuccess = () => resolve();
      req.onerror = () => reject(req.error);
    });
  } catch (e) { console.error('dbPut error:', e); }
}

async function dbClear() {
  try {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('kvstore', 'readwrite');
      const req = tx.objectStore('kvstore').clear();
      req.onsuccess = () => resolve();
      req.onerror = () => reject(req.error);
    });
  } catch (e) { console.error('dbClear error:', e); }
}

async function dbGetAllKeys() {
  try {
    const db = await openDB();
    return new Promise((resolve) => {
      const tx = db.transaction('kvstore', 'readonly');
      const req = tx.objectStore('kvstore').getAllKeys();
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => resolve([]);
    });
  } catch { return []; }
}

async function loadAllData() {
  const [mainData, users, chatMessages, meetings, fileStorage, fileSubmissions] = await Promise.all([
    dbGet(STORAGE_KEY),
    dbGet(USERS_KEY),
    dbGet(CHAT_KEY),
    dbGet(MEETING_KEY),
    dbGet(FILE_STORAGE_KEY),
    dbGet(FILE_SUBMISSIONS_KEY)

function forceLogoutUser(username) { dbPut(FORCE_LOGOUT_KEY, { username, timestamp: Date.now() }).catch(console.error); }
async function checkForceLogout(username) {
  const flag = await dbGet(FORCE_LOGOUT_KEY);
  if (flag && flag.username === username && Date.now() - flag.timestamp < 30000) return true;

}

// ==================== 主题管理 ====================
function useTheme(theme) {
  useEffect(() => {
    const root = document.documentElement;
    if (theme.mode === 'dark') root.classList.add('dark');
    else if (theme.mode === 'system') {
      root.classList.toggle('dark', window.matchMedia('(prefers-color-scheme: dark)').matches);
    } else root.classList.remove('dark');
    document.documentElement.style.setProperty('--accent-color', theme.accent);
  }, [theme]);
}

function trackVisit(data) {
  const today = new Date().toISOString().split('T')[0];
  const visits = data.visits || [];
  visits.push({ date: today, time: new Date().toISOString() });
  if (visits.length > 1000) visits.shift();
  data.visits = visits;
  saveData(data);
}

// ==================== 清理缓存组件 ====================
function ClearCacheButton({ onCleared }) {
  const [show, setShow] = useState(false);
  const [clearing, setClearing] = useState(false);

  async function handleClear() {
    setClearing(true);
    try {
      await dbClear();
      // 同时清理 localStorage 遗留
      localStorage.removeItem(STORAGE_KEY);
      localStorage.removeItem(USERS_KEY);
      localStorage.removeItem(CHAT_KEY);
      localStorage.removeItem(MEETING_KEY);
      localStorage.removeItem(FILE_STORAGE_KEY);
      localStorage.removeItem(FILE_SUBMISSIONS_KEY);
      localStorage.removeItem(LOGIN_STATE_KEY);
      localStorage.removeItem(BANNED_USERS_KEY);
      localStorage.removeItem(FORCE_LOGOUT_KEY);
      localStorage.removeItem(GAME_PREFS_KEY);
      setClearing(false);
      setShow(false);
      if (onCleared) onCleared();
    } catch (e) {
      setClearing(false);
      alert('清理失败: ' + e.message);
    }
  }

  return (
    <>
      <button onClick={()=>setShow(true)} className="p-2 rounded-lg text-gray-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20 transition" title="清理缓存">

      </button>

          <div className="text-5xl mb-4">⚠️</div>

  );

function openBrowserGame(gameId) {
  const b64 = GAMES_B64[gameId];
  if (!b64) { alert('游戏数据不存在'); return; }
  try {
    const binaryStr = atob(b64);
    const bytes = new Uint8Array(binaryStr.length);
    for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);
    const blob = new Blob([bytes], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    window.open(url, '_blank');
  } catch(e) { alert('打开游戏失败: ' + e.message); }
}

// ==================== 文件存储页面 ====================
function FileStoragePage({ fileStorage, setFileStorage, fileSubmissions, setFileSubmissions, onNavigate, currentUser }) {
  const [currentFolder, setCurrentFolder] = useState('root');
  const [search, setSearch] = useState('');
  const [showSubmit, setShowSubmit] = useState(false);
  const [submitForm, setSubmitForm] = useState({ name: '', description: '', targetFolderId: 'root' });
  const [submitFile, setSubmitFile] = useState(null);
  const [viewFile, setViewFile] = useState(null);

  const folders = fileStorage.folders || [];
  const files = fileStorage.files || [];

  // 当前文件夹的子文件夹和文件
  const subFolders = folders.filter(f => f.parentId === currentFolder && f.id !== 'root');
  const currentFiles = files.filter(f => f.folderId === currentFolder);

  // 搜索过滤
  const filteredFolders = search ? subFolders.filter(f => f.name.toLowerCase().includes(search.toLowerCase())) : subFolders;
  const filteredFiles = search ? currentFiles.filter(f => f.name.toLowerCase().includes(search.toLowerCase())) : currentFiles;

  // 面包屑路径
  function getBreadcrumb(folderId) {
    const path = [];
    let fid = folderId;
    while (fid) {
      const folder = folders.find(f => f.id === fid);
      if (folder) { path.unshift(folder); fid = folder.parentId; } else break;
    }
    return path;
  }
  const breadcrumb = getBreadcrumb(currentFolder);

  function navigateToFolder(folderId) { setCurrentFolder(folderId); setSearch(''); }

  function getFileIcon(name) {
    const ext = (name || '').split('.').pop().toLowerCase();
    const map = { pdf: '📄', doc: '📝', docx: '📝', xls: '📊', xlsx: '📊', ppt: '📋', pptx: '📋', jpg: '🖼️', jpeg: '🖼️', png: '🖼️', gif: '🖼️', svg: '🖼️', mp4: '🎬', avi: '🎬', mov: '🎬', mp3: '🎵', wav: '🎵', zip: '📦', rar: '📦', '7z': '📦', txt: '📃', md: '📃', json: '📃', js: '💻', py: '💻', html: '💻', css: '💻' };
    return map[ext] || '📎';
  }

  function formatFileSize(bytes) {
    if (!bytes) return '0 B';
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    return (bytes / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
  }

  function handleDownload(file) {
    if (file.data) {
      const a = document.createElement('a');
      a.href = file.data;
      a.download = file.name;
      a.click();
    }
  }

  function handleViewFile(file) {
    const ext = (file.name || '').split('.').pop().toLowerCase();
    const imageExts = ['jpg','jpeg','png','gif','svg','webp','bmp'];
    const videoExts = ['mp4','webm','ogg','mov'];
    const audioExts = ['mp3','wav','ogg','flac'];
    if (imageExts.includes(ext) || videoExts.includes(ext) || audioExts.includes(ext)) {
      setViewFile(file);
    } else {
      handleDownload(file);
    }
  }

  // 提交反馈文件
  function handleSubmitFile() {
    if (!submitFile) { alert('请选择要提交的文件'); return; }
    if (!submitForm.name.trim()) { alert('请填写您的名称'); return; }
    const maxSize = 1024 * 1024 * 1024 * 1024;
    if (submitFile.size > maxSize) { alert('文件大小不能超过 1TB'); return; }

    const reader = new FileReader();
    reader.onload = function(ev) {
      const newSubmission = {
        id: Date.now(),
        fileName: submitFile.name,
        fileType: submitFile.type,
        fileSize: submitFile.size,
        fileData: ev.target.result,
        submitterName: submitForm.name,
        description: submitForm.description || '',
        targetFolderId: submitForm.targetFolderId,
        status: 'pending',
        submitDate: new Date().toISOString()
      };
      const newSubmissions = [...fileSubmissions, newSubmission];
      setFileSubmissions(newSubmissions);
      saveFileSubmissions(newSubmissions);
      setShowSubmit(false);
      setSubmitForm({ name: '', description: '', targetFolderId: 'root' });
      setSubmitFile(null);
      alert('提交成功！等待管理员审核后即可上架。');
    };
    reader.readAsDataURL(submitFile);
  }

  const pendingCount = fileSubmissions.filter(s => s.status === 'pending').length;

  return (
    <div className="max-w-5xl mx-auto px-4 py-8 fade-in">
      <header className="flex justify-between items-center mb-8">
        <div className="flex items-center gap-3">
          <button onClick={()=>onNavigate('home')} className="text-gray-400 hover:text-accent transition">← 首页</button>
          <h1 className="text-2xl font-extrabold tracking-tight">📁 文件存储</h1>
        </div>
        <div className="flex items-center gap-2">
          <Button variant="outline" size="sm" onClick={()=>setShowSubmit(true)}>📤 提交文件</Button>
          {pendingCount > 0 && <Badge color="red">{pendingCount} 待审核</Badge>}
        </div>
      </header>

      {/* 面包屑 */}
      <div className="flex items-center gap-1.5 mb-5 text-sm flex-wrap">
        {breadcrumb.map((f, i) => (
          <React.Fragment key={f.id}>
            {i > 0 && <span className="text-gray-300">/</span>}
            <button onClick={() => navigateToFolder(f.id)}
              className={`px-2.5 py-1 rounded-lg transition font-medium ${i === breadcrumb.length - 1 ? 'text-accent bg-accent/10' : 'text-gray-500 hover:text-accent hover:bg-gray-100 dark:hover:bg-gray-800'}`}>
              {f.id === 'root' ? '🏠 根目录' : f.name}
            </button>
          </React.Fragment>
        ))}
      </div>

      {/* 搜索 */}
      <div className="relative mb-6">
        <span className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">🔍</span>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="搜索文件或文件夹..."
          className="w-full pl-10 pr-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-800/80 focus:ring-2 focus:ring-accent/40 focus:border-accent outline-none text-sm" />
      </div>

      {/* 文件夹列表 */}
      {filteredFolders.length > 0 && (
        <div className="mb-8">
          <h3 className="text-sm font-semibold text-gray-400 uppercase tracking-wider mb-3">文件夹</h3>
          <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
            {filteredFolders.map(f => (
              <div key={f.id} onClick={() => navigateToFolder(f.id)}
                className="glass rounded-2xl p-4 border border-white/30 dark:border-gray-700/50 shadow-sm card-hover cursor-pointer flex items-center gap-3">
                <div className="w-12 h-12 rounded-xl bg-gradient-to-br from-amber-400/20 to-orange-500/20 flex items-center justify-center text-2xl flex-shrink-0">📁</div>
                <div className="min-w-0">
                  <div className="font-semibold text-sm truncate">{f.name}</div>
                  <div className="text-xs text-gray-400 mt-0.5">{folders.filter(sf => sf.parentId === f.id).length} 文件夹 · {files.filter(sf => sf.folderId === f.id).length} 文件</div>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* 文件列表 */}
      <div>
        <h3 className="text-sm font-semibold text-gray-400 uppercase tracking-wider mb-3">
          文件 ({filteredFiles.length})
        </h3>
        {filteredFiles.length === 0 && filteredFolders.length === 0 ? (
          <div className="text-center py-20 text-gray-400">
            <div className="text-5xl mb-3">📂</div>
            <p className="mb-2">{search ? '未找到匹配的文件' : '这个文件夹还是空的'}</p>
            {!search && <p className="text-sm">点击右上角"提交文件"可以提交您的内容</p>}
          </div>
        ) : (
          <div className="space-y-2">
            {filteredFiles.map(f => (
              <div key={f.id} className="glass rounded-xl border border-white/30 dark:border-gray-700/50 p-3.5 hover:shadow-sm transition flex items-center gap-4 cursor-pointer" onClick={() => handleViewFile(f)}>
                <div className="w-11 h-11 rounded-xl bg-gradient-to-br from-accent/15 to-purple-500/15 flex items-center justify-center text-xl flex-shrink-0">{getFileIcon(f.name)}</div>
                <div className="flex-1 min-w-0">
                  <div className="font-semibold text-sm truncate">{f.name}</div>
                  <div className="text-xs text-gray-400 mt-0.5 flex items-center gap-2">
                    <span>{formatFileSize(f.size)}</span>
                    <span>·</span>
                    <span>{f.uploadDate ? new Date(f.uploadDate).toLocaleDateString('zh-CN') : ''}</span>
                    {f.uploadedBy && <><span>·</span><span>{f.uploadedBy}</span></>}
                  </div>
                </div>
                <button onClick={(e) => { e.stopPropagation(); handleDownload(f); }}
                  className="px-3 py-1.5 rounded-lg text-xs font-medium text-accent hover:bg-accent/10 transition flex-shrink-0">
                  ⬇ 下载
                </button>
              </div>
            ))}
          </div>
        )}
      </div>

      {/* 提交文件弹窗 */}
      <Modal open={showSubmit} onClose={()=>setShowSubmit(false)} title="📤 提交文件" wide>
        <p className="text-sm text-gray-500 mb-4">提交您的文件，管理员审核通过后将会上架到文件存储中。</p>
        <Input label="您的名称" value={submitForm.name} onChange={v=>setSubmitForm({...submitForm, name:v})} placeholder="填写您的姓名或昵称" />
        <div className="mb-4">
          <label className="block text-sm font-semibold mb-1.5 text-gray-600 dark:text-gray-400">选择目标文件夹</label>
          <select value={submitForm.targetFolderId} onChange={e=>setSubmitForm({...submitForm, targetFolderId:e.target.value})}
            className="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-700/80 focus:ring-2 focus:ring-accent/40 outline-none text-sm">
            {folders.map(f => <option key={f.id} value={f.id}>{f.id === 'root' ? '根目录' : f.name}</option>)}
          </select>
        </div>
        <div className="mb-4">
          <label className="block text-sm font-semibold mb-1.5 text-gray-600 dark:text-gray-400">描述（可选）</label>
          <textarea value={submitForm.description} onChange={e=>setSubmitForm({...submitForm, description:e.target.value})} placeholder="简要描述这个文件的内容..." rows="2"
            className="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-700/80 focus:ring-2 focus:ring-accent/40 outline-none resize-none text-sm" />
        </div>
        <div className="mb-4">
          <label className="block text-sm font-semibold mb-1.5 text-gray-600 dark:text-gray-400">选择文件</label>
          <div className="relative">

// ==================== 硬件代码编辑器 ====================
function HardwareCodeEditor({ onBack }) {
  const [code, setCode] = useState('');
  const [output, setOutput] = useState('');
  const [running, setRunning] = useState(false);

  useEffect(() => {
    async function load() {
      const saved = await dbGet('hardware_code');
      if (saved) setCode(saved);
    }
    load();
  }, []);

  function handleSave() {
    dbPut('hardware_code', code).catch(console.error);
  }

  function handleRun() {
    setRunning(true);
    setOutput('⏳ 编译中...\n');
    setTimeout(() => {
      try {
        setOutput(prev => prev + '✅ 编译成功\n📦 上传到设备...\n🚀 固件已烧录，设备重启中\n✓ 设备就绪\n');
      } catch (e) {
        setOutput(prev => prev + '❌ 错误: ' + e.message + '\n');
      }
      setRunning(false);
    }, 1500);
  }

  return (
    <div className="fixed inset-0 z-40 bg-gray-900 flex flex-col fade-in">
      <header className="flex items-center justify-between px-4 py-3 bg-gray-800/95 border-b border-gray-700/50 flex-shrink-0">
        <div className="flex items-center gap-3">
          <button onClick={onBack} className="px-3 py-1.5 rounded-lg text-sm font-semibold text-gray-400 hover:text-white hover:bg-gray-700 transition">← 返回</button>
          <span className="text-lg">🔧</span>
          <h1 className="text-white font-bold">硬件代码编辑器</h1>
        </div>
        <div className="flex gap-2">
          <button onClick={handleSave} className="px-4 py-1.5 rounded-lg text-sm font-semibold bg-accent/20 text-accent hover:bg-accent/30 transition">💾 保存</button>
          <button onClick={handleRun} disabled={running} className="px-4 py-1.5 rounded-lg text-sm font-semibold bg-emerald-500/20 text-emerald-400 hover:bg-emerald-500/30 transition disabled:opacity-50">▶ 运行</button>
        </div>
      </header>
      <div className="flex-1 flex overflow-hidden">
        <div className="flex-1 flex flex-col overflow-hidden">
          <div className="px-4 py-2 bg-gray-800/50 text-gray-400 text-xs font-mono border-b border-gray-700/30">main.ino</div>
          <textarea value={code} onChange={e => setCode(e.target.value)} spellCheck={false}
            className="flex-1 w-full px-4 py-3 bg-gray-900 text-green-400 font-mono text-sm resize-none outline-none border-none leading-relaxed"
            placeholder={'// 在此编写硬件控制代码\n// 示例：\n#include <Arduino.h>\n\nvoid setup() {\n  Serial.begin(9600);\n  pinMode(LED_BUILTIN, OUTPUT);\n}\n\nvoid loop() {\n  digitalWrite(LED_BUILTIN, HIGH);\n  delay(1000);\n  digitalWrite(LED_BUILTIN, LOW);\n  delay(1000);\n}'} />
        </div>
        <div className="w-80 border-l border-gray-700/30 flex flex-col overflow-hidden hidden sm:flex">
          <div className="px-4 py-2 bg-gray-800/50 text-gray-400 text-xs font-mono border-b border-gray-700/30 flex items-center gap-2"><span className="w-2 h-2 rounded-full bg-emerald-500"></span>输出</div>
          <pre className="flex-1 px-4 py-3 text-gray-300 font-mono text-xs overflow-auto leading-relaxed">{output || '等待运行...'}</pre>
        </div>
      </div>
    </div>
  );
}

// ==================== 智能小车控制器（DJI 专业遥控器风格 + 双模式 + 地图路线规划） ====================
function CarController({ onBack }) {
  const [authenticated, setAuthenticated] = useState(false);
  const [password, setPassword] = useState('');
  const [pwdError, setPwdError] = useState('');
  const [driveMode, setDriveMode] = useState('manual');
  const videoRef = useRef(null);
  const mapRef = useRef(null);
  const [cameraOn, setCameraOn] = useState(false);
  const [stream, setStream] = useState(null);
  const [recording, setRecording] = useState(false);
  const [mediaRecorder, setMediaRecorder] = useState(null);
  const [recordedChunks, setRecordedChunks] = useState([]);
  const [photos, setPhotos] = useState([]);
  const [showGallery, setShowGallery] = useState(false);
  const [obstacles, setObstacles] = useState({ front: 200, left: 150, right: 180, back: null });
  const [speed, setSpeed] = useState(0);
  const [throttle, setThrottle] = useState(50);
  const [direction, setDirection] = useState('stop');
  const [honking, setHonking] = useState(false);
  const [autoStatus, setAutoStatus] = useState('待命');
  const [runTime, setRunTime] = useState(0);
  const [totalDist, setTotalDist] = useState(0);
  // ===== 硬件模式 =====
  const [hwMode, setHwMode] = useState(false);
  const [esp32Ip, setEsp32Ip] = useState('192.168.4.1');
  const [esp32Connected, setEsp32Connected] = useState(false);
  const [showHwSettings, setShowHwSettings] = useState(false);
  const [wifiMode, setWifiMode] = useState('ap');
  const [rgbColor, setRgbColor] = useState({r:0,g:0,b:0});
  const [showRgb, setShowRgb] = useState(false);
  // ===== 地图 & 路线规划 =====
  const [showMap, setShowMap] = useState(false);
  const [waypoints, setWaypoints] = useState([]);
  const [carPos, setCarPos] = useState({x:250,y:250,angle:0});
  const [pathHistory, setPathHistory] = useState([]);
  const [isRecordingPath, setIsRecordingPath] = useState(false);
  const [savedRoutes, setSavedRoutes] = useState([]);
  const [routeName, setRouteName] = useState('');
  const [showRoutePanel, setShowRoutePanel] = useState(false);
  const [playingRoute, setPlayingRoute] = useState(null);
  const [playIdx, setPlayIdx] = useState(0);
  const esp32Base = `http://${esp32Ip}`;

  async function esp32Cmd(path) { try { await fetch(esp32Base + path, { mode: 'no-cors' }); } catch(e) {} }
  async function esp32Get(path) { try { const r = await fetch(esp32Base + path); return await r.text(); } catch(e) { return null; } }
  async function connectEsp32() { try { await fetch(esp32Base + '/pwd?pass=YOUR_ADMIN_PASSWORD_HEREL', { mode: 'no-cors' }); setEsp32Connected(true); } catch(e) { setEsp32Connected(false); } }
  function disconnectEsp32() { setEsp32Connected(false); setCameraOn(false); if(driveMode==='auto') esp32Cmd('/autooff'); esp32Cmd('/cmd?action=stop'); }

  // 运行计时器
  useEffect(() => {
    if (!authenticated || direction==='stop') return;
    const t = setInterval(() => setRunTime(p=>p+1), 1000);
    return () => clearInterval(t);
  }, [authenticated, direction]);

  // 里程累加
  useEffect(() => {
    if (!authenticated || direction==='stop') return;
    const t = setInterval(() => setTotalDist(p=>p+speed*0.01), 500);
    return () => clearInterval(t);
  }, [authenticated, direction, speed]);

  // 小车位置更新（模拟器用）
  useEffect(() => {
    if (!authenticated || hwMode || direction==='stop') return;
    const t = setInterval(() => {
      setCarPos(prev => {
        const rad = prev.angle * Math.PI / 180;
        const dx = Math.sin(rad) * speed * 0.05;
        const dy = -Math.cos(rad) * speed * 0.05;
        let newAngle = prev.angle;
        if (direction==='left') newAngle -= 5;
        if (direction==='right') newAngle += 5;
        return { x: prev.x + dx, y: prev.y + dy, angle: newAngle };
      });
    }, 200);
    return () => clearInterval(t);
  }, [authenticated, hwMode, direction, speed]);

  // 路径记录
  useEffect(() => {
    if (!isRecordingPath || direction==='stop') return;
    const t = setInterval(() => {
      setPathHistory(prev => [...prev, {...carPos, t: Date.now()}].slice(-5000));
    }, 300);
    return () => clearInterval(t);
  }, [isRecordingPath, direction, carPos]);

  // 路线回放
  useEffect(() => {
    if (!playingRoute || playIdx >= playingRoute.points.length) {
      if (playingRoute && playIdx >= playingRoute.points.length) { setPlayingRoute(null); setPlayIdx(0); stopCar(); }
      return;
    }
    const t = setTimeout(() => {
      const pt = playingRoute.points[playIdx];
      setCarPos(pt);
      setPlayIdx(p=>p+1);
    }, 300);
    return () => clearTimeout(t);
  }, [playingRoute, playIdx]);

  // 地图绘制
  useEffect(() => {
    if (!showMap) return;
    const canvas = mapRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0,0,W,H);
    // 背景网格
    ctx.fillStyle = '#0a0a1a'; ctx.fillRect(0,0,W,H);
    ctx.strokeStyle = '#1a1a3a'; ctx.lineWidth = 0.5;
    for (let i=0;i<W;i+=20) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,H); ctx.stroke(); }
    for (let i=0;i<H;i+=20) { ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(W,i); ctx.stroke(); }
    // 历史路径
    if (pathHistory.length>1) {
      ctx.strokeStyle = 'rgba(0,200,255,0.4)'; ctx.lineWidth = 2; ctx.beginPath();
      ctx.moveTo(pathHistory[0].x, pathHistory[0].y);
      pathHistory.forEach(p => ctx.lineTo(p.x, p.y));
      ctx.stroke();
    }
    // 路线规划
    if (waypoints.length>1) {
      ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 2.5; ctx.setLineDash([6,4]); ctx.beginPath();
      ctx.moveTo(waypoints[0].x, waypoints[0].y);
      waypoints.forEach(w => ctx.lineTo(w.x, w.y));
      ctx.stroke(); ctx.setLineDash([]);
      waypoints.forEach((w,i) => {
        ctx.fillStyle = i===0?'#10b981':i===waypoints.length-1?'#ef4444':'#f59e0b';
        ctx.beginPath(); ctx.arc(w.x,w.y,6,0,Math.PI*2); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.font = '9px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(i+1, w.x, w.y-10);
      });
    }
    // 小车位置
    ctx.save(); ctx.translate(carPos.x, carPos.y); ctx.rotate(carPos.angle*Math.PI/180);
    ctx.fillStyle = '#3b82f6'; ctx.beginPath(); ctx.moveTo(0,-10); ctx.lineTo(7,8); ctx.lineTo(-7,8); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#60a5fa'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.restore();
    // 指南针
    ctx.save(); ctx.translate(W-30,30);
    ctx.strokeStyle = '#444'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(0,0,18,0,Math.PI*2); ctx.stroke();
    ctx.fillStyle = '#ef4444'; ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('N',0,-8);
    ctx.fillStyle = '#6b7280'; ctx.fillText('S',0,12); ctx.fillText('W',-10,2); ctx.fillText('E',10,2);
    ctx.restore();
  }, [showMap, carPos, pathHistory, waypoints]);

  // 加载已保存路线
  useEffect(() => {
    (async () => {
      const d = await dbGet('car_routes');
      if (d) setSavedRoutes(d);
    })();
  }, []);

  // 真机传感器轮询
  useEffect(() => {
    if (!hwMode || !esp32Connected || !authenticated) return;
    const iv = setInterval(async () => {
      const data = await esp32Get('/sensors');
      if (data) { try { const s = JSON.parse(data); setObstacles(prev=>({...prev,front:s.front??prev.front,left:s.left??prev.left,right:s.right??prev.right,back:null})); if(s.speed!==undefined) setSpeed(s.speed); } catch {} }
    }, 1000);
    return () => clearInterval(iv);
  }, [hwMode, esp32Connected, authenticated]);

  if (!authenticated) {
    return (
      <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{background:'linear-gradient(135deg,#0f0c29,#302b63,#24243e)'}}>
        <div className="glass rounded-3xl p-8 border border-white/20 shadow-2xl text-center max-w-sm fade-in">
          <div className="w-20 h-20 rounded-3xl bg-gradient-to-br from-blue-500 to-cyan-600 flex items-center justify-center text-4xl mx-auto mb-5 shadow-xl">🚗</div>
          <h2 className="text-white font-black text-2xl mb-2">智能小车遥控器</h2>
          <p className="text-gray-400 text-sm mb-4">输入密码进入控制台</p>
          <div className="flex rounded-xl overflow-hidden border border-white/20 mb-4">
            <button onClick={()=>setHwMode(false)} className={`flex-1 px-4 py-2.5 text-xs font-bold transition ${!hwMode?'bg-blue-500 text-white':'bg-white/5 text-gray-400 hover:text-white'}`}>🖥️ 模拟器</button>
            <button onClick={()=>setHwMode(true)} className={`flex-1 px-4 py-2.5 text-xs font-bold transition ${hwMode?'bg-emerald-500 text-white':'bg-white/5 text-gray-400 hover:text-white'}`}>📡 ESP32 真机</button>
          </div>
          {hwMode && (
            <div className="mb-4 space-y-2">
              <input value={esp32Ip} onChange={e=>setEsp32Ip(e.target.value)} placeholder="ESP32 IP 地址" className="w-full px-3 py-2 rounded-lg bg-white/10 border border-white/20 text-white text-xs placeholder-gray-500 outline-none" />
              <div className="flex rounded-lg overflow-hidden border border-white/20">
                <button onClick={()=>setWifiMode('ap')} className={`flex-1 px-3 py-1.5 text-[11px] font-bold transition ${wifiMode==='ap'?'bg-cyan-500 text-white':'bg-white/5 text-gray-400'}`}>📡 AP热点</button>
                <button onClick={()=>setWifiMode('sta')} className={`flex-1 px-3 py-1.5 text-[11px] font-bold transition ${wifiMode==='sta'?'bg-violet-500 text-white':'bg-white/5 text-gray-400'}`}>🏠 STA路由</button>
              </div>
            </div>
          )}
          <input type="password" value={password} onChange={e=>{setPassword(e.target.value);setPwdError('');}}
            placeholder="管理员密码" className="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-gray-500 focus:ring-2 focus:ring-blue-500/50 outline-none text-sm mb-3"
            onKeyDown={e=>{if(e.key==='Enter'){if(password==='YOUR_ADMIN_PASSWORD_HEREL'){setAuthenticated(true);if(hwMode)connectEsp32();}else setPwdError('密码错误');}}} />
          {pwdError&&<p className="text-red-400 text-xs mb-3">{pwdError}</p>}
          <button onClick={()=>{if(password==='YOUR_ADMIN_PASSWORD_HEREL'){setAuthenticated(true);if(hwMode)connectEsp32();}else setPwdError('密码错误');}}
            className="w-full px-6 py-3 rounded-xl text-sm font-bold bg-gradient-to-r from-blue-500 to-cyan-600 text-white btn-shine">🔓 进入控制台</button>
          {hwMode&&<p className="text-gray-500 text-[10px] mt-3">双重密码：WiFi + 网页账号</p>}
        </div>
      </div>
    );
  }

  async function toggleCamera() {
    if (hwMode) { setCameraOn(!cameraOn); return; }
    if (cameraOn) { if(stream){stream.getTracks().forEach(t=>t.stop());setStream(null);} setCameraOn(false); }
    else { try { const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:640},height:{ideal:480}},audio:false}); setStream(s);setCameraOn(true); setTimeout(()=>{if(videoRef.current)videoRef.current.srcObject=s;},100); } catch(e){alert('无法访问摄像头: '+e.message);} }
  }
  function takePhoto() {
    if (hwMode) { esp32Cmd('/capture'); setPhotos(prev=>[{id:Date.now(),data:esp32Base+'/capture?t='+Date.now(),time:new Date().toLocaleString('zh-CN'),hw:true},...prev].slice(0,50)); return; }
    if (!videoRef.current) return;
    const c=document.createElement('canvas'); c.width=videoRef.current.videoWidth||640; c.height=videoRef.current.videoHeight||480;
    c.getContext('2d').drawImage(videoRef.current,0,0); setPhotos(prev=>[{id:Date.now(),data:c.toDataURL('image/jpeg',0.9),time:new Date().toLocaleString('zh-CN')},...prev].slice(0,50));
  }
  function toggleRecording() {
    if (hwMode) { alert('⚠️ ESP32 不支持录像，只能逐张拍照存TF卡。'); return; }
    if (!stream) { alert('请先开启摄像头'); return; }
    if (recording) { if(mediaRecorder){mediaRecorder.stop();setMediaRecorder(null);} setRecording(false); }
    else { const r=new MediaRecorder(stream,{mimeType:'video/webm;codecs=vp9'}); const ch=[]; r.ondataavailable=e=>{if(e.data.size>0)ch.push(e.data);}; r.onstop=()=>{const b=new Blob(ch,{type:'video/webm'});setRecordedChunks(prev=>[{id:Date.now(),url:URL.createObjectURL(b),time:new Date().toLocaleString('zh-CN')},...prev].slice(0,10));}; r.start();setMediaRecorder(r);setRecording(true); }
  }
  function move(dir) {
    setDirection(dir); if(dir!=='stop') setSpeed(throttle);
    if(hwMode&&esp32Connected) esp32Cmd('/cmd?action='+dir);
    else setObstacles(prev=>({...prev,front:Math.max(20,prev.front+(Math.random()-0.5)*30),left:Math.max(20,prev.left+(Math.random()-0.5)*20),right:Math.max(20,prev.right+(Math.random()-0.5)*20),back:null}));
  }
  function stopCar() { setDirection('stop');setSpeed(0); if(hwMode&&esp32Connected) esp32Cmd('/cmd?action=stop'); }
  function honk() {
    setHonking(true);
    if(hwMode&&esp32Connected) esp32Cmd('/beep=on');
    else try{const c=new(window.AudioContext||window.webkitAudioContext)();const o=c.createOscillator();const g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=800;o.type='square';g.gain.value=0.3;o.start();o.stop(c.currentTime+0.5);}catch{}
    setTimeout(()=>setHonking(false),500);
  }
  function toggleAutoDrive(m) { setDriveMode(m); if(hwMode&&esp32Connected) esp32Cmd(m==='auto'?'/autoon':'/autooff'); }
  function setRgb(r,g,b) { setRgbColor({r,g,b}); if(hwMode&&esp32Connected) esp32Cmd(`/rgb?r=${r}&g=${g}&b=${b}`); }

  useEffect(() => {
    if(hwMode) return;
    if(driveMode!=='auto'||!authenticated) return;
    const iv=setInterval(()=>{
      setObstacles(prev=>{
        const n={...prev,front:Math.max(20,prev.front+(Math.random()-0.5)*40),left:Math.max(20,prev.left+(Math.random()-0.5)*20),right:Math.max(20,prev.right+(Math.random()-0.5)*20),back:null};
        if(n.front<50){setDirection('left');setAutoStatus('⬅ 左转避障');setSpeed(30);}
        else if(n.left<40){setDirection('right');setAutoStatus('➡ 右转避障');setSpeed(30);}
        else if(n.right<40){setDirection('left');setAutoStatus('⬅ 左转避障');setSpeed(30);}
        else{setDirection('forward');setAutoStatus('🟢 直行');setSpeed(50);}
        return n;
      });
    },1000);
    return()=>clearInterval(iv);
  },[driveMode,authenticated,hwMode]);

  const dirArrow={forward:'⬆️',backward:'⬇️',left:'⬅️',right:'➡️',stop:'⏹️'};
  const oC=d=>d===null?'text-gray-600':d<50?'text-red-400':d<100?'text-amber-400':'text-emerald-400';
  const oV=d=>d===null?'--':Math.round(d);
  const fmtTime=s=>{const m=Math.floor(s/60);const sec=s%60;return `${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;};

  // 地图点击添加航点
  function handleMapClick(e) {
    if (isRecordingPath) return;
    const rect = e.target.getBoundingClientRect();
    const x = e.clientX - rect.left, y = e.clientY - rect.top;
    setWaypoints(prev => [...prev, {x, y}]);
  }

  // 保存路线到 IndexedDB
  async function saveRoute() {
    if (!routeName || waypoints.length < 2) return;
    const route = { id: Date.now(), name: routeName, points: [...waypoints], time: new Date().toLocaleString('zh-CN') };
    const updated = [...savedRoutes, route];
    setSavedRoutes(updated);
    await dbPut('car_routes', updated);
    setRouteName('');
  }

  // 删除路线
  async function deleteRoute(id) {
    const updated = savedRoutes.filter(r => r.id !== id);
    setSavedRoutes(updated);
    await dbPut('car_routes', updated);
  }

  // 沿路线导航
  function navigateRoute(route) {
    setWaypoints(route.points);
    setPlayIdx(0);
    setPlayingRoute(route);
  }

  return (
    <div className="fixed inset-0 z-40 flex flex-col fade-in overflow-hidden" style={{background:'#0a0a1a'}}>
      {/* ===== DJI 风格顶栏 ===== */}
      <header className="flex items-center justify-between px-3 py-1.5 bg-black/90 border-b border-gray-800/80 flex-shrink-0" style={{background:'linear-gradient(180deg,#111827,#0a0a1a)'}}>
        <div className="flex items-center gap-2">
          <button onClick={()=>{if(stream)stream.getTracks().forEach(t=>t.stop());if(hwMode&&esp32Connected)disconnectEsp32();onBack();}} className="p-1.5 rounded-lg text-gray-500 hover:text-white hover:bg-white/10 transition">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${hwMode?'bg-emerald-500/20 text-emerald-400':'bg-blue-500/20 text-blue-400'}`}>{hwMode?'ESP32':'SIM'}</span>
          {hwMode&&<span className={`w-2 h-2 rounded-full ${esp32Connected?'bg-emerald-500 animate-pulse':'bg-red-500'}`}></span>}
        </div>
        <div className="flex items-center gap-3 text-[11px]">
          {/* 遥测信息 */}
          <div className="flex items-center gap-1"><span className="text-gray-500">SPD</span><span className="text-cyan-400 font-mono font-bold">{speed}</span></div>
          <div className="flex items-center gap-1"><span className="text-gray-500">DST</span><span className="text-white font-mono font-bold">{totalDist.toFixed(1)}m</span></div>
          <div className="flex items-center gap-1"><span className="text-gray-500">TIME</span><span className="text-white font-mono font-bold">{fmtTime(runTime)}</span></div>
          <div className="flex items-center gap-1"><span className="text-gray-500">DIR</span><span className="text-amber-400 font-mono font-bold">{direction==='stop'?'IDLE':direction.toUpperCase()}</span></div>
        </div>
        <div className="flex items-center gap-1.5">
          <button onClick={()=>setShowMap(!showMap)} className={`px-2 py-1 rounded text-[10px] font-bold transition ${showMap?'bg-cyan-500/20 text-cyan-400':'bg-white/5 text-gray-500 hover:text-white'}`}>🗺️ 地图</button>
          <button onClick={()=>setShowRoutePanel(!showRoutePanel)} className={`px-2 py-1 rounded text-[10px] font-bold transition ${showRoutePanel?'bg-amber-500/20 text-amber-400':'bg-white/5 text-gray-500 hover:text-white'}`}>📍 路线</button>
          {hwMode&&<button onClick={()=>setShowHwSettings(!showHwSettings)} className="px-2 py-1 rounded text-[10px] font-bold bg-white/5 text-gray-500 hover:text-white">⚙️</button>}
          <button onClick={()=>setShowRgb(!showRgb)} className="px-2 py-1 rounded text-[10px] font-bold bg-white/5 text-gray-500 hover:text-white">💡</button>
        </div>
      </header>

      {/* 设置面板 */}
      {hwMode&&showHwSettings&&(
        <div className="px-3 py-2 bg-gray-900/95 border-b border-gray-800/50 space-y-2 fade-in text-xs">
          <div className="flex items-center gap-2"><span className="text-gray-500 w-12">IP</span><input value={esp32Ip} onChange={e=>setEsp32Ip(e.target.value)} className="flex-1 px-2 py-1 rounded bg-white/5 border border-white/10 text-white text-xs outline-none" /><button onClick={connectEsp32} className="px-3 py-1 rounded text-[10px] font-bold bg-emerald-500/20 text-emerald-400">连接</button></div>
          <div className="flex items-center gap-2"><span className="text-gray-500 w-12">WiFi</span><div className="flex rounded overflow-hidden border border-gray-700/50"><button onClick={()=>setWifiMode('ap')} className={`px-2 py-1 text-[10px] font-bold ${wifiMode==='ap'?'bg-cyan-500 text-white':'bg-gray-800 text-gray-400'}`}>AP</button><button onClick={()=>setWifiMode('sta')} className={`px-2 py-1 text-[10px] font-bold ${wifiMode==='sta'?'bg-violet-500 text-white':'bg-gray-800 text-gray-400'}`}>STA</button></div><span className="text-gray-600 text-[10px]">{wifiMode==='ap'?'192.168.4.1':'路由器'}</span></div>
        </div>
      )}
      {showRgb&&(
        <div className="px-3 py-2 bg-gray-900/95 border-b border-gray-800/50 fade-in">
          <div className="flex items-center gap-2"><span className="text-[10px] text-gray-500">RGB</span><input type="range" min="0" max="255" value={rgbColor.r} onChange={e=>setRgb(+e.target.value,rgbColor.g,rgbColor.b)} className="w-14 accent-red-500" /><input type="range" min="0" max="255" value={rgbColor.g} onChange={e=>setRgb(rgbColor.r,+e.target.value,rgbColor.b)} className="w-14 accent-green-500" /><input type="range" min="0" max="255" value={rgbColor.b} onChange={e=>setRgb(rgbColor.r,rgbColor.g,+e.target.value)} className="w-14 accent-blue-500" /><div className="w-5 h-5 rounded-full border border-white/20" style={{background:`rgb(${rgbColor.r},${rgbColor.g},${rgbColor.b})`}}></div><button onClick={()=>setRgb(0,0,0)} className="text-[10px] text-gray-500">关</button></div>
        </div>
      )}

      {/* ===== 主视口 ===== */}
      <div className="flex-1 flex overflow-hidden relative">
        {/* FPV 摄像头主画面 */}
        <div className="flex-1 relative bg-black">
          {cameraOn ? (
            hwMode ? <img src={esp32Base+'/cam'} alt="ESP32-CAM" className="w-full h-full object-cover" /> : <video ref={videoRef} autoPlay playsInline muted className="w-full h-full object-cover" />
          ) : (
            <div className="absolute inset-0 flex items-center justify-center">
              <div className="text-center">
                <div className="w-24 h-24 rounded-full border-2 border-gray-700 flex items-center justify-center mb-3 mx-auto"><span className="text-5xl opacity-30">📷</span></div>
                <p className="text-gray-600 text-sm">FPV 未启动</p>
              </div>
            </div>
          )}
          {/* HUD 叠加层 - 左上 */}
          <div className="absolute top-2 left-2 flex flex-col gap-1">
            {recording&&<div className="flex items-center gap-1 px-2 py-0.5 rounded bg-red-600/80 backdrop-blur-sm"><div className="w-1.5 h-1.5 rounded-full bg-white animate-pulse"></div><span className="text-white text-[10px] font-bold">REC</span></div>}
            <div className="px-2 py-1 rounded bg-black/50 backdrop-blur-sm text-[10px] text-white font-mono">{hwMode?'ESP32-CAM':'本地摄像头'}</div>
          </div>
          {/* HUD - 右上 */}
          <div className="absolute top-2 right-2 flex flex-col gap-1 items-end">
            {direction!=='stop'&&<div className="px-2 py-0.5 rounded bg-black/60 backdrop-blur-sm text-white text-[10px] font-bold">{dirArrow[direction]} {direction.toUpperCase()}</div>}
            <div className="px-2 py-0.5 rounded bg-black/50 backdrop-blur-sm text-[10px]"><span className={driveMode==='auto'?'text-emerald-400':'text-amber-400'}>{driveMode==='auto'?'AUTO':'MANUAL'}</span></div>
          </div>
          {/* HUD - 左下障碍物 */}
          <div className="absolute bottom-2 left-2 flex gap-1.5">
            {[{k:'left',l:'L'},{k:'front',l:'F'},{k:'right',l:'R'}].map(({k,l})=>(
              <div key={k} className="px-2 py-1 rounded bg-black/60 backdrop-blur-sm text-center">
                <div className="text-[9px] text-gray-500">{l}</div>
                <div className={`text-sm font-black font-mono ${oC(obstacles[k])}`}>{oV(obstacles[k])}</div>
              </div>
            ))}
          </div>
          {/* HUD - 右下速度表 */}
          <div className="absolute bottom-2 right-2 px-3 py-1.5 rounded bg-black/60 backdrop-blur-sm text-center">
            <div className="text-[9px] text-gray-500">cm/s</div>
            <div className="text-2xl font-black text-cyan-400 font-mono leading-none">{speed}</div>
          </div>
          {/* 中心十字准星 */}
          <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
            <div className="w-8 h-8 border border-white/20 rounded-full"></div>
            <div className="absolute w-0.5 h-3 bg-white/20 -top-1.5"></div>
            <div className="absolute w-0.5 h-3 bg-white/20 -bottom-1.5"></div>
            <div className="absolute w-3 h-0.5 bg-white/20 -left-1.5"></div>
            <div className="absolute w-3 h-0.5 bg-white/20 -right-1.5"></div>
          </div>
        </div>

        {/* ===== 地图侧面板 ===== */}
        {showMap && (
          <div className="w-72 border-l border-gray-800/80 bg-gray-950 flex flex-col fade-in overflow-hidden">
            <div className="px-2 py-1.5 bg-gray-900/90 border-b border-gray-800/50 flex items-center justify-between">
              <span className="text-[11px] font-bold text-gray-300">🗺️ 地图 & 路线</span>
              <div className="flex gap-1">
                <button onClick={()=>setIsRecordingPath(!isRecordingPath)} className={`px-1.5 py-0.5 rounded text-[9px] font-bold ${isRecordingPath?'bg-red-500/20 text-red-400':'bg-white/5 text-gray-500 hover:text-white'}`}>{isRecordingPath?'⏺ 录制中':'⏺ 录路径'}</button>
                <button onClick={()=>{setPathHistory([]);setWaypoints([]);}} className="px-1.5 py-0.5 rounded text-[9px] font-bold bg-white/5 text-gray-500 hover:text-white">清除</button>
              </div>
            </div>
            <canvas ref={mapRef} width={288} height={288} onClick={handleMapClick} className="w-full cursor-crosshair flex-shrink-0" />
            {/* 航点列表 */}
            {waypoints.length>0&&(
              <div className="px-2 py-1.5 border-t border-gray-800/50 space-y-1">
                <div className="flex items-center justify-between">
                  <span className="text-[10px] text-gray-500">{waypoints.length} 个航点</span>
                  <button onClick={()=>setWaypoints([])} className="text-[9px] text-red-400 hover:underline">清除航点</button>
                </div>
                {waypoints.length>=2&&(
                  <div className="flex items-center gap-1">
                    <input value={routeName} onChange={e=>setRouteName(e.target.value)} placeholder="路线名称" className="flex-1 px-2 py-1 rounded bg-white/5 border border-white/10 text-white text-[10px] outline-none" />
                    <button onClick={saveRoute} className="px-2 py-1 rounded text-[9px] font-bold bg-amber-500/20 text-amber-400">保存</button>
                  </div>
                )}
              </div>
            )}
            {/* 已保存路线 */}
            {savedRoutes.length>0&&(
              <div className="flex-1 overflow-y-auto px-2 py-1.5 border-t border-gray-800/50 space-y-1">
                <span className="text-[10px] text-gray-500">已保存路线</span>
                {savedRoutes.map(r=>(
                  <div key={r.id} className="flex items-center gap-1 p-1.5 rounded bg-white/5">
                    <span className="text-[10px] text-white flex-1 truncate">📍 {r.name}</span>
                    <button onClick={()=>navigateRoute(r)} className="text-[9px] text-cyan-400">导航</button>
                    <button onClick={()=>deleteRoute(r.id)} className="text-[9px] text-red-400">删</button>
                  </div>
                ))}
              </div>
            )}
            {isRecordingPath&&<div className="px-2 py-1 border-t border-gray-800/50 text-[10px] text-red-400 animate-pulse">⏺ 正在记录路径 ({pathHistory.length} 点)...</div>}
            {playingRoute&&<div className="px-2 py-1 border-t border-gray-800/50 text-[10px] text-cyan-400">▶ 导航中 {playIdx}/{playingRoute.points.length}</div>}
          </div>
        )}
      </div>

      {/* ===== 底部控制栏 ===== */}
      <div className="flex-shrink-0 border-t border-gray-800/80" style={{background:'linear-gradient(0deg,#0a0a1a,#111827)'}}>
        {/* 摄像头控制条 */}
        <div className="flex items-center justify-between px-3 py-1 border-b border-gray-800/50">
          <div className="flex items-center gap-2">
            <button onClick={toggleCamera} className={`px-3 py-1.5 rounded-lg text-[11px] font-bold transition ${cameraOn?'bg-red-500/20 text-red-400':'bg-white/5 text-gray-400 hover:text-white'}`}>📷 {cameraOn?'关闭':'开启'}</button>
            {cameraOn&&<>
              <button onClick={takePhoto} className="px-3 py-1.5 rounded-lg text-[11px] font-bold bg-white/5 text-blue-400 hover:bg-blue-500/20">📸 拍照</button>
              {!hwMode&&<button onClick={toggleRecording} className={`px-3 py-1.5 rounded-lg text-[11px] font-bold transition ${recording?'bg-red-500 text-white animate-pulse':'bg-white/5 text-amber-400 hover:bg-amber-500/20'}`}>{recording?'⏺ 停止':'🔴 录像'}</button>}
            </>}
          </div>
          <div className="flex items-center gap-2">
            {/* 驾驶模式 */}
            <div className="flex rounded-lg overflow-hidden border border-gray-700/50">
              <button onClick={()=>toggleAutoDrive('manual')} className={`px-3 py-1 text-[11px] font-bold transition ${driveMode==='manual'?'bg-amber-500 text-white':'bg-gray-800 text-gray-500 hover:text-white'}`}>手动</button>
              <button onClick={()=>toggleAutoDrive('auto')} className={`px-3 py-1 text-[11px] font-bold transition ${driveMode==='auto'?'bg-emerald-500 text-white':'bg-gray-800 text-gray-500 hover:text-white'}`}>自动</button>
            </div>
            {driveMode==='auto'&&<span className="text-[11px] text-emerald-400 font-mono">{autoStatus}</span>}
          </div>
        </div>

        {/* 主操控区 */}
        <div className="flex items-center justify-between px-4 py-3">
          {/* 左：方向 D-Pad */}
          <div className="flex flex-col items-center gap-1.5">
            <button onTouchStart={()=>move('forward')} onMouseDown={()=>move('forward')} onTouchEnd={stopCar} onMouseUp={stopCar} onMouseLeave={stopCar}
              className={`w-14 h-14 rounded-2xl flex items-center justify-center text-xl font-bold transition-all active:scale-90 ${direction==='forward'?'bg-cyan-500 text-white shadow-lg shadow-cyan-500/30':'bg-white/5 text-gray-400 hover:bg-white/10'}`}>
              <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4l-8 8h5v8h6v-8h5z"/></svg>
            </button>
            <div className="flex gap-1.5 items-center">
              <button onTouchStart={()=>move('left')} onMouseDown={()=>move('left')} onTouchEnd={stopCar} onMouseUp={stopCar} onMouseLeave={stopCar}
                className={`w-14 h-14 rounded-2xl flex items-center justify-center text-xl font-bold transition-all active:scale-90 ${direction==='left'?'bg-amber-500 text-white shadow-lg shadow-amber-500/30':'bg-white/5 text-gray-400 hover:bg-white/10'}`}>
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M4 12l8-8v5h8v6h-8v5z"/></svg>
              </button>
              <button onClick={stopCar} className="w-14 h-14 rounded-2xl flex items-center justify-center text-sm font-bold bg-red-500/10 text-red-400 hover:bg-red-500/20 transition-all active:scale-90 border border-red-500/20">STOP</button>
              <button onTouchStart={()=>move('right')} onMouseDown={()=>move('right')} onTouchEnd={stopCar} onMouseUp={stopCar} onMouseLeave={stopCar}
                className={`w-14 h-14 rounded-2xl flex items-center justify-center text-xl font-bold transition-all active:scale-90 ${direction==='right'?'bg-amber-500 text-white shadow-lg shadow-amber-500/30':'bg-white/5 text-gray-400 hover:bg-white/10'}`}>
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M20 12l-8-8v5H4v6h8v5z"/></svg>
              </button>
            </div>
            <button onTouchStart={()=>move('backward')} onMouseDown={()=>move('backward')} onTouchEnd={stopCar} onMouseUp={stopCar} onMouseLeave={stopCar}
              className={`w-14 h-14 rounded-2xl flex items-center justify-center text-xl font-bold transition-all active:scale-90 ${direction==='backward'?'bg-violet-500 text-white shadow-lg shadow-violet-500/30':'bg-white/5 text-gray-400 hover:bg-white/10'}`}>
              <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 20l8-8h-5V4H9v8H4z"/></svg>
            </button>
          </div>

          {/* 中：鸣笛 + 自动状态 */}
          <div className="flex flex-col items-center gap-2">
            <button onClick={honk} className={`w-14 h-14 rounded-full flex items-center justify-center text-2xl transition-all active:scale-90 ${honking?'bg-yellow-500 text-black shadow-lg shadow-yellow-500/30':'bg-white/5 text-yellow-400 hover:bg-yellow-500/10 border border-yellow-500/20'}`}>📢</button>
            {driveMode==='auto'&&(
              <div className="px-3 py-1.5 rounded-lg bg-emerald-500/10 border border-emerald-500/20 text-center">
                <div className="text-[9px] text-emerald-400">自动</div>
                <div className="text-[11px] text-white font-bold">{autoStatus}</div>
                <button onClick={()=>{toggleAutoDrive('manual');stopCar();}} className="mt-1 px-2 py-0.5 rounded text-[9px] font-bold bg-red-500/20 text-red-400">切回手动</button>
              </div>
            )}
          </div>

          {/* 右：油门滑块 */}
          <div className="flex flex-col items-center gap-1">
            <span className="text-[9px] text-gray-500 font-mono">油门 {throttle}%</span>
            <div className="h-32 flex items-center">
              <input type="range" min="10" max="100" value={throttle} onChange={e=>setThrottle(+e.target.value)}
                className="h-28 appearance-none bg-gray-800 rounded-lg cursor-pointer" style={{writingMode:'vertical-lr',direction:'rtl',accentColor:'#06b6d4'}} />
            </div>
            <span className="text-[9px] text-cyan-400 font-mono font-bold">{throttle}%</span>
          </div>

  const [addingType, setAddingType] = useState(null);
  const [showChat, setShowChat] = useState(false);
  const [showMeeting, setShowMeeting] = useState(false);
  const [showHardware, setShowHardware] = useState(false);
  const [showCar, setShowCar] = useState(false);

  const isAdmin = currentUser?.role === 'admin';

  const filteredTeachers = data.teachers.filter(t => !search || t.name.includes(search) || t.workId.includes(search) || t.subject.includes(search));
  const filteredStudents = data.students.filter(s => !search || s.name.includes(search) || s.studentId.includes(search) || s.className.includes(search));

  function handleSave(type, item) {
    const newData = { ...data };
    if (type === 'teacher') {
      const idx = newData.teachers.findIndex(t => t.id === item.id);
      if (idx >= 0) newData.teachers[idx] = item;
      else { item.id = Date.now(); newData.teachers.push(item); }
    } else {
      const idx = newData.students.findIndex(s => s.id === item.id);
      if (idx >= 0) newData.students[idx] = item;
      else { item.id = Date.now(); newData.students.push(item); }
    }
    setData(newData);
    setEditingItem(null); setAddingType(null);
  }

  function handleDelete(type, id) {
    if (!confirm('确定删除这条记录吗？')) return;
    const newData = { ...data };
    if (type === 'teacher') newData.teachers = newData.teachers.filter(t => t.id !== id);

// ==================== 社交功能：好友 + 私信 ====================
const FRIENDSHIPS_KEY = 'friendships_data';
const PRIVATE_MSGS_KEY = 'private_messages_data';

function FriendsPage({ currentUser, onBack, users }) {
  const [friends, setFriends] = useState([]);
  const [pending, setPending] = useState([]);
  const [blocked, setBlocked] = useState([]);
  const [searchQuery, setSearchQuery] = useState('');
  const [tab, setTab] = useState('friends'); // friends | pending | blocked
  const [msg, setMsg] = useState('');

  useEffect(() => {
    async function load() {
      const data = await dbGet(FRIENDSHIPS_KEY) || { friends: [], pending: [], blocked: [] };
      setFriends(data.friends || []);
      setPending(data.pending || []);
      setBlocked(data.blocked || []);
    }
    load();
    const iv = setInterval(load, 3000);
    return () => clearInterval(iv);
  }, []);

  async function saveFriendData(f, p, b) {
    setFriends(f); setPending(p); setBlocked(b);
    await dbPut(FRIENDSHIPS_KEY, { friends: f, pending: p, blocked: b });
  }

  async function sendFriendRequest(targetName) {
    if (!targetName.trim()) return;
    if (targetName === currentUser.name) { setMsg('不能加自己为好友'); return; }
    const isAlready = friends.some(f => f.userId === targetName || f.friendId === targetName);
    if (isAlready) { setMsg('已经是好友了'); return; }
    const isPending = pending.some(p => (p.fromUserId === targetName && p.toUserId === currentUser.name) || (p.fromUserId === currentUser.name && p.toUserId === targetName));
    if (isPending) { setMsg('已存在待处理的申请'); return; }
    const isBlockedUser = blocked.includes(targetName);
    if (isBlockedUser) { setMsg('该用户已被拉黑'); return; }
    const newPending = [...pending, { id: Date.now(), fromUserId: currentUser.name, toUserId: targetName.trim(), status: 'pending', createdAt: new Date().toISOString() }];
    setPending(newPending);
    await dbPut(FRIENDSHIPS_KEY, { friends, pending: newPending, blocked });
    setSearchQuery(''); setMsg('好友申请已发送');
    setTimeout(() => setMsg(''), 3000);
  }

  async function acceptRequest(req) {
    const newFriends = [...friends, 
      { id: Date.now(), userId: currentUser.name, friendId: req.fromUserId, status: 'accepted', createdAt: new Date().toISOString() },
      { id: Date.now()+1, userId: req.fromUserId, friendId: currentUser.name, status: 'accepted', createdAt: new Date().toISOString() }
    ];
    const newPending = pending.filter(p => p.id !== req.id);
    await saveFriendData(newFriends, newPending, blocked);
  }

  async function rejectRequest(req) {
    const newPending = pending.filter(p => p.id !== req.id);
    await saveFriendData(friends, newPending, blocked);
  }

  async function removeFriend(friendName) {
    const newFriends = friends.filter(f => !(f.userId === friendName || f.friendId === friendName));
    await saveFriendData(newFriends, pending, blocked);
  }

  async function toggleBlock(userId) {
    const isBlocked = blocked.includes(userId);
    const newBlocked = isBlocked ? blocked.filter(b => b !== userId) : [...blocked, userId];
    const newFriends = isBlocked ? friends : friends.filter(f => !(f.userId === userId || f.friendId === userId));
    await saveFriendData(newFriends, pending, newBlocked);
  }

  const myFriends = [...new Set(friends.filter(f => f.userId === currentUser.name || f.friendId === currentUser.name).map(f => f.userId === currentUser.name ? f.friendId : f.userId))];
  const myPending = pending.filter(p => p.toUserId === currentUser.name);
  const mySent = pending.filter(p => p.fromUserId === currentUser.name);
  const allUserNames = (users || []).map(u => u.name || u.username).filter(n => n && n !== currentUser.name);
  const searchResults = searchQuery.trim() ? allUserNames.filter(n => n.toLowerCase().includes(searchQuery.toLowerCase())).slice(0, 10) : [];

  return (
    <div className="max-w-4xl mx-auto px-4 py-8 fade-in">
      <header className="flex items-center gap-4 mb-6">
        <button onClick={onBack} className="px-4 py-2 rounded-xl text-sm font-semibold text-gray-500 hover:text-accent hover:bg-gray-100 dark:hover:bg-gray-800 transition-all">← 返回</button>
        <h1 className="text-2xl font-black gradient-text">👥 好友</h1>
      </header>

      {msg && <div className="mb-4 px-4 py-2.5 rounded-xl bg-accent/10 text-accent text-sm font-medium fade-in">{msg}</div>}

      {/* 添加好友 */}
      <div className="glass rounded-2xl p-5 border border-white/30 dark:border-gray-700/50 mb-6 shadow-sm">
        <h3 className="font-bold text-sm mb-3">🔍 添加好友</h3>
        <div className="flex gap-2">
          <input value={searchQuery} onChange={e => setSearchQuery(e.target.value)}
            placeholder="输入用户名搜索..." className="flex-1 px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-700/80 text-sm focus:ring-2 focus:ring-accent/40 outline-none" />
          {searchQuery.trim() && !myFriends.includes(searchQuery.trim()) && (
            <button onClick={() => sendFriendRequest(searchQuery.trim())}
              className="px-5 py-2.5 rounded-xl text-sm font-bold bg-gradient-to-r from-accent to-purple-600 text-white btn-shine">添加</button>
          )}
        </div>
        {searchResults.length > 0 && (
