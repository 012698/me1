function PrivateChatPage({ currentUser, onBack, targetUser }) {
  const [conversations, setConversations] = useState({});
  const [activeChat, setActiveChat] = useState(targetUser || null);
  const [input, setInput] = useState('');
  const chatEndRef = useRef(null);
  const pollRef = useRef(null);

  useEffect(() => {
    async function load() {
      const data = await dbGet(PRIVATE_MSGS_KEY) || { conversations: {} };
      setConversations(data.conversations || {});
    }
    load();
    pollRef.current = setInterval(load, 2000);
    return () => clearInterval(pollRef.current);
  }, []);

  useEffect(() => {
    if (chatEndRef.current) chatEndRef.current.scrollIntoView({ behavior: 'smooth' });
  }, [conversations, activeChat]);

  async function sendMessage() {
    if (!input.trim() || !activeChat) return;
    const data = await dbGet(PRIVATE_MSGS_KEY) || { conversations: {} };
    const convos = data.conversations || {};
    const key = [currentUser.name, activeChat].sort().join('::');
    const msgs = convos[key] || [];
    const newMsg = { id: Date.now(), senderId: currentUser.name, receiverId: activeChat, type: 'text', content: input.trim(), isRead: true, timestamp: new Date().toISOString() };
    convos[key] = [...msgs, newMsg];
    await dbPut(PRIVATE_MSGS_KEY, { conversations: convos });
    setConversations({...convos});
    setInput('');
  }

  async function sendFileMsg(type, fileData, fileName, fileSize) {
    if (!activeChat) return;
    const data = await dbGet(PRIVATE_MSGS_KEY) || { conversations: {} };
    const convos = data.conversations || {};
    const key = [currentUser.name, activeChat].sort().join('::');
    const msgs = convos[key] || [];
    const newMsg = { id: Date.now(), senderId: currentUser.name, receiverId: activeChat, type, content: type === 'image' ? '📷 图片' : type === 'video' ? '🎬 视频' : '📎 文件', fileData, fileName: fileName || '', fileSize: fileSize || 0, isRead: true, timestamp: new Date().toISOString() };
    convos[key] = [...msgs, newMsg];
    await dbPut(PRIVATE_MSGS_KEY, { conversations: convos });
    setConversations({...convos});
  }

  function handleFileSelect(e, type) {
    const file = e.target.files[0];
    if (!file) return;
    const maxSize = 1024 * 1024 * 1024 * 1024;
    if (file.size > maxSize) { alert('文件不能超过1TB'); e.target.value = ''; return; }
    const reader = new FileReader();
    reader.onload = function(ev) { sendFileMsg(type, ev.target.result, file.name, file.size); };
    reader.readAsDataURL(file);
    e.target.value = '';
  }

  function markAsRead(chatWith) {
    const key = [currentUser.name, chatWith].sort().join('::');
    const msgs = conversations[key] || [];
    const hasUnread = msgs.some(m => m.receiverId === currentUser.name && !m.isRead);
    if (hasUnread) {
      const updated = {...conversations};
      updated[key] = msgs.map(m => m.receiverId === currentUser.name ? {...m, isRead: true} : m);
      dbPut(PRIVATE_MSGS_KEY, { conversations: updated });
      setConversations(updated);
    }
  }

  function formatTime(ts) {
    const d = new Date(ts); return d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
  }

  // Get all conversation partners
  const partners = Object.entries(conversations).map(([key, msgs]) => {
    const parts = key.split('::');
    const partner = parts[0] === currentUser.name ? parts[1] : parts[0];
    const lastMsg = msgs[msgs.length - 1];
    const unread = msgs.filter(m => m.receiverId === currentUser.name && !m.isRead).length;
    return { name: partner, lastMsg, unread, msgs };
  }).sort((a, b) => (b.lastMsg?.timestamp || '') > (a.lastMsg?.timestamp || '') ? 1 : -1);

  const activeMsgs = activeChat ? (conversations[[currentUser.name, activeChat].sort().join('::')] || []) : [];

  return (
    <div className="flex flex-col h-[calc(100vh-2rem)] max-w-5xl mx-auto fade-in">
      <header className="flex justify-between items-center py-4 px-4 border-b border-gray-200/50 dark:border-gray-700/50">
        <div className="flex items-center gap-3">
          <button onClick={onBack} className="text-gray-400 hover:text-accent transition">← 返回</button>
          <h1 className="text-xl font-extrabold">✉️ 私信</h1>
        </div>
        <div className="flex items-center gap-2 text-sm text-gray-500">
          <span className="font-medium">{currentUser.name}</span>
        </div>
      </header>

      <div className="flex flex-1 overflow-hidden">
        {/* 对话列表 */}
        <div className="w-64 border-r border-gray-200/50 dark:border-gray-700/50 bg-gray-50/50 dark:bg-gray-800/30 overflow-y-auto">
          <div className="p-3">
            <div className="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">对话 ({partners.length})</div>
            {partners.length === 0 && <div className="text-xs text-gray-400 text-center py-4">暂无对话</div>}
            {partners.map(p => (
              <div key={p.name} onClick={() => { setActiveChat(p.name); markAsRead(p.name); }}
                className={`flex items-center gap-2.5 py-2.5 px-3 rounded-xl cursor-pointer transition mb-1 ${activeChat === p.name ? 'bg-accent/10 text-accent' : 'hover:bg-white/60 dark:hover:bg-gray-700/40'}`}>
                <div className="w-9 h-9 rounded-full bg-gradient-to-br from-accent/30 to-purple-500/30 flex items-center justify-center text-xs font-bold text-accent flex-shrink-0">{p.name.charAt(0)}</div>
                <div className="flex-1 min-w-0">
                  <div className="flex items-center justify-between">
                    <span className="text-sm font-medium truncate">{p.name}</span>
                    {p.unread > 0 && <span className="text-[10px] px-1.5 py-0.5 rounded-full bg-red-500 text-white font-bold">{p.unread}</span>}
                  </div>
                  {p.lastMsg && <div className="text-xs text-gray-400 truncate">{p.lastMsg.type === 'text' ? p.lastMsg.content : p.lastMsg.content}</div>}
                </div>
              </div>
            ))}
          </div>
        </div>

        {/* 聊天区 */}
        <div className="flex-1 flex flex-col">
          {activeChat ? (
            <>
              <div className="px-4 py-3 border-b border-gray-100/80 dark:border-gray-700/50 bg-gray-50/30 dark:bg-gray-800/20 flex items-center gap-2.5">
                <div className="w-8 h-8 rounded-full bg-gradient-to-br from-accent/30 to-purple-500/30 flex items-center justify-center text-xs font-bold text-accent">{activeChat.charAt(0)}</div>
                <span className="font-semibold text-sm">{activeChat}</span>
              </div>
              <div className="flex-1 overflow-y-auto px-4 py-4 space-y-4">
                {activeMsgs.length === 0 && <div className="text-center py-16 text-gray-400"><div className="text-4xl mb-3">💬</div><p>开始聊天吧！</p></div>}
                {activeMsgs.map(m => {
                  const isMe = m.senderId === currentUser.name;
                  return (
                    <div key={m.id} className={`flex ${isMe ? 'justify-end' : 'justify-start'} slide-up`}>
                      <div className="max-w-[75%]">
                        <div className={`flex items-center gap-2 mb-1 ${isMe ? 'justify-end' : ''}`}>
                          <span className="text-xs text-gray-300 dark:text-gray-500">{formatTime(m.timestamp)}</span>
                        </div>
                        <div className={`px-4 py-3 text-sm leading-relaxed ${isMe ? 'bg-gradient-to-r from-accent to-accent-dark text-white rounded-2xl rounded-br-md shadow-sm' : 'glass border border-white/30 dark:border-gray-700/50 rounded-2xl rounded-bl-md shadow-sm'}`}>
                          {m.type === 'image' && m.fileData ? (
                            <img src={m.fileData} alt="" className="max-w-[280px] rounded-xl cursor-pointer" onClick={() => window.open(m.fileData, '_blank')} />
                          ) : m.type === 'video' && m.fileData ? (
                            <video src={m.fileData} controls className="max-w-[280px] rounded-xl" />
                          ) : m.type === 'file' && m.fileData ? (
                            <div className="flex items-center gap-2"><span>📎</span><a href={m.fileData} download={m.fileName} className="underline text-xs">{m.fileName || '下载'}</a></div>
                          ) : m.content}
                        </div>
                      </div>
                    </div>
                  );
                })}
                <div ref={chatEndRef} />
              </div>
              <div className="px-4 py-3 border-t border-gray-200/50 dark:border-gray-700/50 glass">
                <div className="flex gap-2 items-end">
                  <div className="flex gap-0.5">
                    {[{icon:'🖼️',type:'image',accept:'image/*'},{icon:'🎬',type:'video',accept:'video/*'},{icon:'📎',type:'file',accept:undefined}].map(f=>(
                      <label key={f.type} className="cursor-pointer px-2.5 py-2 rounded-lg text-gray-400 hover:text-accent hover:bg-accent/10 transition text-lg">{f.icon}<input type="file" accept={f.accept} className="hidden" onChange={e=>handleFileSelect(e,f.type)} /></label>
                    ))}
                  </div>
                  <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}}}
                    placeholder="输入私信..." className="flex-1 px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-600 bg-white/80 dark:bg-gray-700/50 focus:ring-2 focus:ring-accent/40 outline-none text-sm" />
                  <Button onClick={sendMessage} className="self-end rounded-xl px-5">发送</Button>
                </div>
              </div>
            </>
          ) : (
            <div className="flex-1 flex items-center justify-center text-gray-400">
              <div className="text-center"><div className="text-5xl mb-3">✉️</div><p>选择一个对话开始聊天</p></div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function ChatRoom({ currentUser, onBack, messages, setMessages }) {
  const [input, setInput] = useState('');
  const [chatFilter, setChatFilter] = useState('all');
  const chatEndRef = useRef(null);
  const pollRef = useRef(null);

  useEffect(() => {
    async function pollMessages() {
      const latest = await dbGet(CHAT_KEY);
      if (latest) {
        setMessages(prev => {
          if (latest.length !== prev.length) return latest;
          return prev;
        });
      }
    }
    pollRef.current = setInterval(pollMessages, 2000);
    return () => clearInterval(pollRef.current);
  }, []);

  useEffect(() => {
    if (chatEndRef.current) chatEndRef.current.scrollIntoView({ behavior: 'smooth' });
  }, [messages]);

  function sendMessage() {
    if (!input.trim()) return;
    const newMsg = { id: Date.now(), userId: currentUser.name, userName: currentUser.name, role: currentUser.role, type: 'text', content: input.trim(), timestamp: new Date().toISOString() };
    const newMessages = [...messages, newMsg];
    setMessages(newMessages);
    saveChatMessages(newMessages);
    setInput('');
  }

  function sendFileMessage(type, fileData, fileName, fileSize) {
    const newMsg = { id: Date.now(), userId: currentUser.name, userName: currentUser.name, role: currentUser.role, type, content: type === 'image' ? '📷 图片' : type === 'video' ? '🎬 视频' : '📎 文件', fileData, fileName: fileName || '', fileSize: fileSize || 0, timestamp: new Date().toISOString() };
    const newMessages = [...messages, newMsg];
    setMessages(newMessages);
    saveChatMessages(newMessages);
  }

  function handleFileSelect(e, type) {
    const file = e.target.files[0];
    if (!file) return;
    const maxSize = 1024 * 1024 * 1024 * 1024; // 1TB
    if (file.size > maxSize) { alert('文件大小不能超过 1TB'); e.target.value = ''; return; }
    const reader = new FileReader();
    reader.onload = function(ev) { sendFileMessage(type, ev.target.result, file.name, file.size); };
    reader.readAsDataURL(file);
    e.target.value = '';
  }

  function handleKeyDown(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } }

  function deleteMessage(id) {
    if (currentUser.role !== 'admin') return;
    if (!confirm('确定删除这条消息？')) return;
    const newMessages = messages.filter(m => m.id !== id);
    setMessages(newMessages);
    saveChatMessages(newMessages);
  }

  function formatFileSize(bytes) { if (!bytes) return ''; if (bytes < 1024) return bytes + ' B'; if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB'; return (bytes / (1024 * 1024)).toFixed(1) + ' MB'; }

  function formatTime(ts) {
    const d = new Date(ts); const now = new Date(); const isToday = d.toDateString() === now.toDateString();
    const time = d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
    return isToday ? time : d.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' }) + ' ' + time;
  }

  const filteredMessages = chatFilter === 'all' ? messages : messages.filter(m => m.role === chatFilter);
  const onlineUsers = [...new Set(messages.slice(-50).map(m => m.userName))];

  return (
    <div className="flex flex-col h-[calc(100vh-2rem)] max-w-5xl mx-auto fade-in">
      <header className="flex justify-between items-center py-4 px-4 border-b border-gray-200/50 dark:border-gray-700/50">
        <div className="flex items-center gap-3">
          <button onClick={onBack} className="text-gray-400 hover:text-accent transition">← 返回</button>
          <h1 className="text-xl font-extrabold">💬 师生聊天室</h1>
        </div>
        <div className="flex items-center gap-2">
          <button onClick={() => onNavigate('social')} className="px-3 py-1.5 rounded-lg text-xs font-semibold bg-accent/10 text-accent hover:bg-accent/20 transition">👥 好友</button>
          <button onClick={() => { window._showPrivateChat = true; }} className="px-3 py-1.5 rounded-lg text-xs font-semibold bg-purple-500/10 text-purple-500 hover:bg-purple-500/20 transition">✉️ 私信</button>
        </div>
        <div className="flex items-center gap-2 text-sm text-gray-500">
          <span className="relative inline-block w-2.5 h-2.5 rounded-full bg-emerald-400 online-pulse"></span>
          <span className="font-medium">{currentUser.name}</span>
          <Badge color={currentUser.role==='admin'?'accent':'gray'}>{currentUser.role==='admin'?'管理员':'用户'}</Badge>
        </div>
      </header>

      <div className="flex flex-1 overflow-hidden">
        {/* 侧边栏 */}
        <div className="hidden md:block w-52 border-r border-gray-200/50 dark:border-gray-700/50 bg-gray-50/50 dark:bg-gray-800/30 p-3 overflow-y-auto">
          <div className="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">在线 ({onlineUsers.length})</div>
          {onlineUsers.map(u => (
            <div key={u} className="flex items-center gap-2.5 py-2 px-3 rounded-xl hover:bg-white/60 dark:hover:bg-gray-700/40 transition">
              <div className="w-8 h-8 rounded-full bg-gradient-to-br from-accent/30 to-purple-500/30 flex items-center justify-center text-xs font-bold text-accent">{u.charAt(0)}</div>
              <div className="truncate text-sm font-medium">{u}</div>
            </div>
          ))}
        </div>

        <div className="flex-1 flex flex-col">
          {/* 筛选 */}
          <div className="flex gap-1.5 px-4 py-2.5 border-b border-gray-100/80 dark:border-gray-700/50 bg-gray-50/30 dark:bg-gray-800/20">
            {[{k:'all',l:'全部'},{k:'admin',l:'管理员'},{k:'user',l:'师生'}].map(f=>(
              <button key={f.k} onClick={()=>setChatFilter(f.k)} className={`px-3 py-1 rounded-lg text-xs font-medium transition ${chatFilter===f.k?'bg-accent text-white shadow-sm':'text-gray-500 hover:bg-gray-100 dark:hover:bg-gray-700'}`}>{f.l}</button>
            ))}
          </div>

          {/* 消息列表 */}
          <div className="flex-1 overflow-y-auto px-4 py-4 space-y-4">
            {filteredMessages.length === 0 && (
              <div className="text-center py-16 text-gray-400">
                <div className="text-5xl mb-3">💭</div>
                <p>还没有消息，来打个招呼吧！</p>
              </div>
            )}
            {filteredMessages.map(m => {
              const isMe = m.userName === currentUser.name;
              return (
                <div key={m.id} className={`flex ${isMe ? 'justify-end' : 'justify-start'} slide-up`}>
                  <div className={`max-w-[75%] ${isMe ? 'order-2' : ''}`}>
                    <div className={`flex items-center gap-2 mb-1 ${isMe ? 'justify-end' : ''}`}>
                      <span className="text-xs font-medium text-gray-400">{m.userName}</span>
                      <Badge color={m.role==='admin'?'accent':'gray'}>{m.role==='admin'?'管理员':'师生'}</Badge>
                      <span className="text-xs text-gray-300 dark:text-gray-500">{formatTime(m.timestamp)}</span>
                      {currentUser.role === 'admin' && !isMe && (
                        <button onClick={()=>deleteMessage(m.id)} className="text-xs text-red-400 hover:text-red-500 ml-1">删除</button>
                      )}
                    </div>
                    <div className={`px-4 py-3 text-sm leading-relaxed ${
                      isMe
                        ? 'bg-gradient-to-r from-accent to-accent-dark text-white rounded-2xl rounded-br-md shadow-sm'
                        : 'glass border border-white/30 dark:border-gray-700/50 rounded-2xl rounded-bl-md shadow-sm'
                    }`}>
                      {m.type === 'image' && m.fileData ? (
                        <div>
                          <img src={m.fileData} alt={m.fileName || '图片'} className="max-w-full rounded-xl cursor-pointer max-h-72 object-contain" onClick={() => window.open(m.fileData, '_blank')} style={{maxWidth: '300px'}} />
                          {m.fileName && <div className="text-xs mt-1.5 opacity-70">{m.fileName}</div>}
                        </div>
                      ) : m.type === 'video' && m.fileData ? (
                        <div>
                          <video src={m.fileData} controls className="max-w-full rounded-xl" style={{maxWidth: '300px', maxHeight: '240px'}} />
                          {m.fileName && <div className="text-xs mt-1.5 opacity-70">{m.fileName}</div>}
                        </div>
                      ) : m.type === 'file' && m.fileData ? (
                        <div className="flex items-center gap-3">
                          <div className="w-11 h-11 rounded-xl bg-white/20 dark:bg-gray-700/50 flex items-center justify-center text-lg">📎</div>
                          <div className="flex-1 min-w-0">
                            <div className="font-semibold truncate">{m.fileName || '未知文件'}</div>
                            <div className="text-xs opacity-70">{formatFileSize(m.fileSize)}</div>
                          </div>
                          <a href={m.fileData} download={m.fileName || '下载文件'} className="text-xs underline opacity-80 hover:opacity-100">下载</a>
                        </div>
                      ) : m.content}
                    </div>
                  </div>
                </div>
              );
            })}
            <div ref={chatEndRef} />
          </div>

          {/* 输入框 */}
          <div className="px-4 py-3 border-t border-gray-200/50 dark:border-gray-700/50 glass">
            <div className="flex gap-2 items-end">
              <div className="flex gap-0.5">
                {[
                  { icon: '🖼️', type: 'image', accept: 'image/*', title: '图片' },
                  { icon: '🎬', type: 'video', accept: 'video/*', title: '视频' },
                  { icon: '📎', type: 'file', accept: undefined, title: '文件' }
                ].map(f => (
                  <label key={f.type} className="cursor-pointer px-2.5 py-2 rounded-lg text-gray-400 hover:text-accent hover:bg-accent/10 transition text-lg" title={`发送${f.title}`}>
                    {f.icon}
                    <input type="file" accept={f.accept} className="hidden" onChange={e => handleFileSelect(e, f.type)} />
                  </label>
                ))}
              </div>
              <textarea value={input} onChange={e=>setInput(e.target.value)} onKeyDown={handleKeyDown}
                placeholder="输入消息，Enter 发送..." rows="1"
                className="flex-1 px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-600 bg-white/80 dark:bg-gray-700/50 focus:ring-2 focus:ring-accent/40 focus:border-accent outline-none resize-none text-sm"
                style={{maxHeight: '120px'}} />
              <Button onClick={sendMessage} className="self-end rounded-xl px-5">发送</Button>
            </div>
            <div className="text-xs text-gray-400 mt-1.5 pl-16">图片/视频/文件不超过 1TB · 数据存储在本地 IndexedDB</div>
          </div>
        </div>
      </div>
    </div>
  );
}

// ==================== 会议功能 ====================
function MeetingRoom({ currentUser, onBack, meetings, setMeetings }) {
  const [showCreate, setShowCreate] = useState(false);
  const [selectedMeeting, setSelectedMeeting] = useState(null);
  const [showQuickVideo, setShowQuickVideo] = useState(false);
  const [quickUrlInput, setQuickUrlInput] = useState('');
  const [createForm, setCreateForm] = useState({ title: '', date: '', time: '', duration: '60', location: '', description: '', type: 'offline' });
  const pollRef = useRef(null);

  const isAdmin = currentUser.role === 'admin';

  useEffect(() => {
    async function poll() {
      const latest = await dbGet(MEETING_KEY);
      if (latest) {
        setMeetings(prev => {
          if (latest.length !== prev.length || JSON.stringify(latest) !== JSON.stringify(prev)) return latest;
          return prev;
        });
      }
    }
    pollRef.current = setInterval(poll, 3000);
    return () => clearInterval(pollRef.current);
  }, []);

  function createMeeting() {
    if (!createForm.title || !createForm.date || !createForm.time) { alert('请填写会议标题、日期和时间'); return; }
    if (createForm.type === 'video' && !createForm.location.trim()) { alert('视频会议请填写会议链接\n\n支持：腾讯会议、Zoom、Google Meet、飞书会议等'); return; }
    const newMeeting = { id: Date.now(), title: createForm.title, date: createForm.date, time: createForm.time, duration: parseInt(createForm.duration) || 60, location: createForm.location || '', description: createForm.description || '', type: createForm.type, creator: currentUser.name, creatorRole: currentUser.role, participants: [currentUser.name], status: 'upcoming', createdAt: new Date().toISOString() };
    const newMeetings = [newMeeting, ...meetings];
    setMeetings(newMeetings);
    saveMeetings(newMeetings);
    setShowCreate(false);
    setCreateForm({ title: '', date: '', time: '', duration: '60', location: '', description: '', type: 'offline' });
  }

  function deleteMeeting(id) { if (!confirm('确定删除这个会议？')) return; const newMeetings = meetings.filter(m => m.id !== id); setMeetings(newMeetings); saveMeetings(newMeetings); if (selectedMeeting?.id === id) setSelectedMeeting(null); }
  function joinMeeting(id) { const newMeetings = meetings.map(m => m.id === id && !m.participants.includes(currentUser.name) ? { ...m, participants: [...m.participants, currentUser.name] } : m); setMeetings(newMeetings); saveMeetings(newMeetings); }
  function leaveMeeting(id) { const newMeetings = meetings.map(m => m.id === id ? { ...m, participants: m.participants.filter(p => p !== currentUser.name) } : m); setMeetings(newMeetings); saveMeetings(newMeetings); }
  function updateMeetingStatus(id, status) { const newMeetings = meetings.map(m => m.id === id ? { ...m, status } : m); setMeetings(newMeetings); saveMeetings(newMeetings); }

  function enterVideoCall(meetingUrl) { if (!meetingUrl) { alert('未设置会议链接'); return; } window.open(meetingUrl, '_blank'); }
  function joinQuickVideo() { if (!quickUrlInput.trim()) { alert('请输入会议链接'); return; } let url = quickUrlInput.trim(); if (!url.startsWith('http://') && !url.startsWith('https://')) url = 'https://' + url; window.open(url, '_blank'); setShowQuickVideo(false); setQuickUrlInput(''); }

  function formatDuration(mins) { if (mins < 60) return mins + ' 分钟'; const h = Math.floor(mins / 60); const m = mins % 60; return m > 0 ? `${h} 小时 ${m} 分钟` : `${h} 小时`; }
  function getMeetingStatus(meeting) {
    const now = new Date(); const start = new Date(meeting.date + 'T' + meeting.time); const end = new Date(start.getTime() + meeting.duration * 60000);
    if (meeting.status === 'cancelled') return { label: '已取消', color: 'red' };
    if (meeting.status === 'ended') return { label: '已结束', color: 'gray' };
    if (now >= start && now <= end) return { label: '进行中', color: 'green' };
    if (now > end) return { label: '已过时', color: 'gray' };
    return { label: '即将开始', color: 'blue' };
  }

  const today = new Date().toISOString().split('T')[0];
  const upcoming = meetings.filter(m => m.date >= today && m.status !== 'cancelled' && m.status !== 'ended').sort((a,b) => (a.date+a.time).localeCompare(b.date+b.time));
  const past = meetings.filter(m => m.date < today || m.status === 'cancelled' || m.status === 'ended').sort((a,b) => (b.date+b.time).localeCompare(a.date+a.time));

  // 会议详情
  if (selectedMeeting) {
    const m = meetings.find(mt => mt.id === selectedMeeting.id);
    if (!m) { setSelectedMeeting(null); return null; }
    const status = getMeetingStatus(m);
    const isJoined = m.participants.includes(currentUser.name);
    return (
      <div className="max-w-3xl mx-auto px-4 py-6 fade-in">
        <header className="flex justify-between items-center mb-6">
          <button onClick={() => setSelectedMeeting(null)} className="text-gray-400 hover:text-accent transition">← 返回会议列表</button>
          <div className="flex gap-2">
            {isAdmin && m.status !== 'cancelled' && (
              <>
                {status.label === '即将开始' && <Button variant="outline" size="sm" onClick={() => updateMeetingStatus(m.id, 'ended')}>结束会议</Button>}
                <Button variant="danger" size="sm" onClick={() => deleteMeeting(m.id)}>删除会议</Button>
              </>
            )}
          </div>
        </header>

        <div className="glass rounded-2xl border border-white/30 dark:border-gray-700/50 shadow-sm p-7">
          <div className="flex items-start justify-between mb-5">
            <h2 className="text-2xl font-extrabold">{m.title}</h2>
            <Badge color={status.color}>{status.label}</Badge>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-5 mb-6">
            {[
              { icon: '📅', label: '日期', value: m.date },
              { icon: '⏰', label: '时间', value: `${m.time}（${formatDuration(m.duration)}）` },
              { icon: m.type === 'video' ? '📹' : m.type === 'online' ? '💻' : '🏢', label: m.type === 'video' ? '视频会议' : m.type === 'online' ? '线上会议' : '线下会议', value: m.location || '未指定' },
              { icon: '👤', label: '发起人', value: m.creator }
            ].map((item, i) => (
              <div key={i} className="flex items-center gap-3 p-3 rounded-xl bg-gray-50/80 dark:bg-gray-700/30">
                <span className="text-2xl">{item.icon}</span>
                <div><div className="text-xs text-gray-400 font-medium">{item.label}</div><div className="font-semibold text-sm">{item.value}</div></div>
              </div>
            ))}
          </div>

          {m.description && (
            <div className="mb-6 p-4 rounded-xl bg-gray-50/80 dark:bg-gray-700/30">
              <div className="text-xs text-gray-400 font-medium mb-1">会议说明</div>
              <div className="text-sm leading-relaxed whitespace-pre-wrap">{m.description}</div>
            </div>
          )}

          {m.type === 'video' && m.status !== 'cancelled' && (
            <div className="mb-6 p-5 rounded-xl bg-gradient-to-r from-accent/10 via-purple-500/10 to-blue-500/10 dark:from-accent/20 dark:via-purple-500/20 dark:to-blue-500/20 border border-accent/10">
              <div className="flex items-center justify-between">
                <div className="flex items-center gap-3">
                  <span className="text-3xl">📹</span>
                  <div><div className="font-bold">视频会议室</div><div className="text-sm text-gray-500">点击进入视频会议</div></div>
                </div>
                <Button onClick={() => enterVideoCall(m.location)}>📹 进入</Button>
              </div>
              {m.location ? (
                <div className="mt-3 flex items-center gap-3 text-sm">
                  <span className="text-gray-400 truncate max-w-xs">链接：{m.location}</span>
                  <button onClick={() => { navigator.clipboard.writeText(m.location); alert('链接已复制！'); }} className="text-accent hover:underline text-xs font-medium whitespace-nowrap">复制链接</button>
                </div>
              ) : (
                <div className="mt-2 text-sm text-amber-500">⚠️ 未设置会议链接</div>
              )}
            </div>
          )}

          <div className="border-t border-gray-100/80 dark:border-gray-700/50 pt-5">
            <div className="flex justify-between items-center mb-3">
              <div className="text-sm font-semibold">参会人员 ({m.participants.length})</div>
              {!isJoined && m.status !== 'cancelled' ? <Button size="sm" onClick={() => joinMeeting(m.id)}>参加</Button>
              : isJoined && m.status !== 'cancelled' ? <Button variant="ghost" size="sm" onClick={() => leaveMeeting(m.id)}>取消参加</Button> : null}
            </div>
            <div className="flex flex-wrap gap-2">
              {m.participants.map(p => (
                <div key={p} className="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-accent/10 text-accent text-sm font-medium">
                  <div className="w-5 h-5 rounded-full bg-accent/20 flex items-center justify-center text-xs font-bold">{p.charAt(0)}</div>
                  {p}
                </div>
              ))}
            </div>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className="max-w-5xl mx-auto px-4 py-8 fade-in">
      <header className="flex justify-between items-center mb-8">
        <div className="flex items-center gap-3">
          <button onClick={onBack} className="text-gray-400 hover:text-accent transition">← 返回</button>
          <h1 className="text-2xl font-extrabold tracking-tight">📅 会议中心</h1>
        </div>
        <div className="flex items-center gap-2">
          <Badge color={currentUser.role==='admin'?'accent':'gray'}>{currentUser.role==='admin'?'管理员':'师生'}</Badge>
          <span className="text-sm text-gray-500 font-medium">{currentUser.name}</span>
          <Button variant="outline" size="sm" onClick={()=>setShowQuickVideo(true)}>📹 快速视频</Button>
          {isAdmin && <Button size="sm" onClick={()=>setShowCreate(true)}>+ 创建会议</Button>}
        </div>
      </header>

      <div className="mb-10">
        <h3 className="text-lg font-bold mb-4 flex items-center gap-2">即将到来 <Badge color="blue">{upcoming.length}</Badge></h3>
        {upcoming.length === 0 ? (
          <div className="text-center py-16 text-gray-400"><div className="text-5xl mb-3">📋</div><p>暂无即将到来的会议</p></div>
        ) : (
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            {upcoming.map(m => {
              const status = getMeetingStatus(m);
              const isJoined = m.participants.includes(currentUser.name);
              return (
                <div key={m.id} className="glass rounded-2xl border border-white/30 dark:border-gray-700/50 p-5 card-hover cursor-pointer" onClick={() => setSelectedMeeting(m)}>
                  <div className="flex justify-between items-start mb-3">
                    <h4 className="font-bold text-base">{m.title}</h4>
                    <Badge color={status.color}>{status.label}</Badge>
                  </div>
                  <div className="flex items-center gap-3 text-sm text-gray-500 mb-3">
                    <span>📅 {m.date}</span><span>⏰ {m.time}</span>
                    <span>{m.type === 'video' ? '📹' : m.type === 'online' ? '💻' : '🏢'}</span>
                  </div>
                  {m.location && <div className="text-sm text-gray-400 mb-3 truncate">📍 {m.location}</div>}
                  <div className="flex justify-between items-center">
                    <div className="flex items-center gap-1.5 text-xs text-gray-400">
                      <span>👥 {m.participants.length}人</span>
                      {isJoined && <span className="text-emerald-500 font-medium">✓ 已参加</span>}
                    </div>
                    <span className="text-xs text-gray-400">{m.creator} 发起</span>
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>

      {past.length > 0 && (
        <div>
          <h3 className="text-lg font-bold mb-4 flex items-center gap-2">历史会议 <Badge color="gray">{past.length}</Badge></h3>
          <div className="space-y-2">
            {past.slice(0, 10).map(m => {
              const status = getMeetingStatus(m);
              return (
                <div key={m.id} className="glass rounded-xl border border-white/30 dark:border-gray-700/50 p-3.5 hover:shadow-sm transition cursor-pointer opacity-60 hover:opacity-80" onClick={() => setSelectedMeeting(m)}>
                  <div className="flex justify-between items-center">
                    <div className="flex items-center gap-3">
                      <Badge color={status.color}>{status.label}</Badge>
                      <span className="font-medium text-sm">{m.title}</span>
                      <span className="text-xs text-gray-400">{m.date} {m.time}</span>
                    </div>
                    <span className="text-xs text-gray-400">👥 {m.participants.length}</span>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      <Modal open={showCreate} onClose={()=>setShowCreate(false)} title="创建会议" wide>
        <Input label="会议标题" value={createForm.title} onChange={v=>setCreateForm({...createForm, title:v})} placeholder="输入会议标题" />
        <div className="grid grid-cols-2 gap-3 mb-4">
          <Input label="日期" type="date" value={createForm.date} onChange={v=>setCreateForm({...createForm, date:v})} />
          <Input label="时间" type="time" value={createForm.time} onChange={v=>setCreateForm({...createForm, time:v})} />
        </div>
        <div className="grid grid-cols-2 gap-3 mb-4">
          <Input label="时长（分钟）" type="number" value={createForm.duration} onChange={v=>setCreateForm({...createForm, duration:v})} placeholder="60" />
          <div className="mb-4">
            <label className="block text-sm font-semibold mb-1.5 text-gray-600 dark:text-gray-400">会议类型</label>
            <select value={createForm.type} onChange={e=>setCreateForm({...createForm, type:e.target.value})}
              className="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-700/80 focus:ring-2 focus:ring-accent/40 outline-none text-sm">
              <option value="offline">🏢 线下会议</option><option value="online">💻 线上会议</option><option value="video">📹 视频会议</option>
            </select>
          </div>
        </div>
        <Input label={createForm.type === 'video' ? '会议链接（必填）' : '会议地点/链接'} value={createForm.location} onChange={v=>setCreateForm({...createForm, location:v})} placeholder={createForm.type === 'video' ? '粘贴腾讯会议/Zoom/Google Meet 等链接' : '线下填地点，线上填链接'} />
        <div className="mb-4">
          <label className="block text-sm font-semibold mb-1.5 text-gray-600 dark:text-gray-400">会议说明</label>
          <textarea value={createForm.description} onChange={e=>setCreateForm({...createForm, description:e.target.value})} placeholder="可选..." rows="3"
            className="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-700/80 focus:ring-2 focus:ring-accent/40 outline-none resize-none text-sm" />
        </div>
        <Button className="w-full" onClick={createMeeting}>创建会议</Button>
      </Modal>

      <Modal open={showQuickVideo} onClose={()=>setShowQuickVideo(false)} title="📹 快速加入视频会议">
        <p className="text-sm text-gray-500 mb-4">粘贴任意视频会议链接，直接加入开会</p>
        <Input label="会议链接" value={quickUrlInput} onChange={setQuickUrlInput} placeholder="粘贴腾讯会议/Zoom/Google Meet/飞书会议链接..." />
        <div className="mt-2 text-xs text-gray-400 space-y-1.5 pl-1">
          <div>📌 腾讯会议：<span className="text-gray-500">https://meeting.tencent.com/dm/r/xxxxx</span></div>
          <div>📌 Zoom：<span className="text-gray-500">https://zoom.us/j/xxxxx</span></div>
          <div>📌 Google Meet：<span className="text-gray-500">https://meet.google.com/xxx-xxx-xxx</span></div>
          <div>📌 飞书会议：<span className="text-gray-500">https://vc.feishu.cn/j/xxxxx</span></div>
        </div>
        <Button className="w-full mt-5" onClick={joinQuickVideo}>加入会议</Button>
      </Modal>
    </div>
  );
}

// ==================== 账号管理 ====================
function AccountManager() {
  const [users, setUsers] = useState([]);
  const [banned, setBanned] = useState([]);
  const [search, setSearch] = useState('');
  const [filter, setFilter] = useState('all'); // all | banned | active
  const [toast, setToast] = useState('');
  const [detailUser, setDetailUser] = useState(null);

  useEffect(() => {
    async function load() {
      const u = window._cachedUsers || [];
      setUsers([...u]);
      const b = await loadBannedUsers();
      setBanned(b);
    }
    load();
    // 每3秒刷新
    const iv = setInterval(async () => {
      const u = window._cachedUsers || [];
      setUsers([...u]);
      const b = await loadBannedUsers();
      setBanned(b);
    }, 3000);
    return () => clearInterval(iv);
  }, []);

  function showToast(msg) {
    setToast(msg);
    setTimeout(() => setToast(''), 2500);
  }

  function isBanned(username) {
    return banned.includes(username);
  }

  function handleForceLogout(user) {
    if (!confirm(`确定要强制让「${user.displayName || user.username}」下线吗？`)) return;
    forceLogoutUser(user.username);
    showToast(`已发送强制下线指令：${user.displayName || user.username}`);
  }

  function handleDeleteAccount(user) {
    if (!confirm(`确定要删除「${user.displayName || user.username}」的账号吗？此操作不可恢复！`)) return;
    const allUsers = window._cachedUsers || [];
    const filtered = allUsers.filter(u => u.username !== user.username);
    saveUsers(filtered);
    window._cachedUsers = filtered;
    setUsers([...filtered]);
    // 同时解除拉黑
    if (banned.includes(user.username)) {
      const newBanned = banned.filter(b => b !== user.username);
      saveBannedUsers(newBanned);
      setBanned(newBanned);
    }
    showToast(`已删除账号：${user.displayName || user.username}`);
  }

  function handleToggleBan(user) {
    const username = user.username;
    let newBanned;
    if (banned.includes(username)) {
      newBanned = banned.filter(b => b !== username);
      showToast(`已解封：${user.displayName || username}`);
    } else {
      if (!confirm(`确定要拉黑「${user.displayName || username}」吗？拉黑后该用户将无法登录。`)) return;
      newBanned = [...banned, username];
      // 同时强制下线
      forceLogoutUser(username);
      showToast(`已拉黑并强制下线：${user.displayName || username}`);
    }
    saveBannedUsers(newBanned);
    setBanned(newBanned);
  }

  function handleBanAll() {
    const activeUsernames = users.filter(u => u.username).map(u => u.username);
    if (activeUsernames.length === 0) { showToast('没有可拉黑的账号'); return; }
    if (!confirm(`确定要拉黑全部 ${activeUsernames.length} 个账号吗？`)) return;
    saveBannedUsers(activeUsernames);
    setBanned(activeUsernames);
    showToast(`已拉黑全部 ${activeUsernames.length} 个账号`);
  }

  function handleUnbanAll() {
    if (banned.length === 0) { showToast('没有被封账号'); return; }
    if (!confirm(`确定要解封全部 ${banned.length} 个账号吗？`)) return;
    saveBannedUsers([]);
    setBanned([]);
    showToast(`已解封全部 ${banned.length} 个账号`);
  }

  const loginMethodLabels = { username: '🔑 账号密码', wechat: '💬 微信', qq: '🐧 QQ', phone: '📱 手机号' };
  const loginMethodColors = { username: 'bg-indigo-100 text-indigo-700 dark:bg-indigo-900/40 dark:text-indigo-300', wechat: 'bg-green-100 text-green-700 dark:bg-green-900/40 dark:text-green-300', qq: 'bg-blue-100 text-blue-700 dark:bg-blue-900/40 dark:text-blue-300', phone: 'bg-orange-100 text-orange-700 dark:bg-orange-900/40 dark:text-orange-300' };

  const filtered = users.filter(u => {
    if (search) {
      const s = search.toLowerCase();
      const match = (u.username || '').toLowerCase().includes(s) || (u.displayName || '').toLowerCase().includes(s) || (u.phone || '').includes(s) || (u.wechatId || '').toLowerCase().includes(s) || (u.qqId || '').toLowerCase().includes(s);
      if (!match) return false;
    }
    if (filter === 'banned') return isBanned(u.username);
    if (filter === 'active') return !isBanned(u.username);
    return true;
  });

  return (
    <div>
      {/* Toast */}
      {toast && (
        <div className="fixed top-6 right-6 z-50 glass rounded-xl px-5 py-3 text-sm font-semibold text-emerald-700 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800/50 shadow-lg fade-in">
          ✅ {toast}
        </div>
      )}

      {/* 统计栏 */}
      <div className="grid grid-cols-3 gap-3 mb-6">
        <div className="glass rounded-xl p-4 border border-white/30 dark:border-gray-700/50 text-center">
          <div className="text-2xl font-black gradient-text">{users.length}</div>
          <div className="text-xs text-gray-500 mt-1">总账号数</div>
        </div>
        <div className="glass rounded-xl p-4 border border-white/30 dark:border-gray-700/50 text-center">
          <div className="text-2xl font-black text-emerald-500">{users.filter(u => !isBanned(u.username)).length}</div>
          <div className="text-xs text-gray-500 mt-1">正常账号</div>
        </div>
        <div className="glass rounded-xl p-4 border border-white/30 dark:border-gray-700/50 text-center">
          <div className="text-2xl font-black text-red-500">{banned.length}</div>
          <div className="text-xs text-gray-500 mt-1">已拉黑</div>
        </div>
      </div>

      {/* 搜索 + 筛选 + 批量操作 */}
      <div className="flex flex-wrap gap-2 mb-4 items-center">
        <input value={search} onChange={e => setSearch(e.target.value)} placeholder="搜索账号..."
          className="flex-1 min-w-[160px] px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-700/80 text-sm focus:ring-2 focus:ring-accent/40 outline-none" />
        <select value={filter} onChange={e => setFilter(e.target.value)}
          className="px-3 py-2.5 rounded-xl border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-700/80 text-sm focus:ring-2 focus:ring-accent/40 outline-none">
          <option value="all">全部</option>
          <option value="active">正常</option>
          <option value="banned">已拉黑</option>
        </select>
        <Button size="sm" variant="danger" onClick={handleBanAll}>🚫 全部拉黑</Button>
        <Button size="sm" onClick={handleUnbanAll}>✅ 全部解封</Button>
      </div>

      {/* 账号列表 */}
      {filtered.length === 0 ? (
        <div className="text-center py-10 text-gray-400">
          <div className="text-4xl mb-3">📋</div>
          <p className="text-sm">暂无{filter === 'banned' ? '被封' : filter === 'active' ? '正常' : ''}账号</p>
        </div>
      ) : (
        <div className="space-y-2">
          {filtered.map(u => (
            <div key={u.username} className={`glass rounded-xl p-4 border transition-all ${isBanned(u.username) ? 'border-red-300 dark:border-red-800/50 bg-red-50/50 dark:bg-red-900/10' : 'border-white/30 dark:border-gray-700/50'} card-hover`}>
              <div className="flex items-center gap-3">
                {/* 头像 */}
                <div className={`w-11 h-11 rounded-xl flex items-center justify-center text-lg font-bold ${isBanned(u.username) ? 'bg-red-100 text-red-500 dark:bg-red-900/30' : 'bg-gradient-to-br from-accent to-purple-600 text-white'}`}>
                  {(u.displayName || u.username || '?')[0].toUpperCase()}
                </div>
                {/* 信息 */}
                <div className="flex-1 min-w-0">
                  <div className="flex items-center gap-2 flex-wrap">
                    <span className="font-bold text-sm truncate">{u.displayName || u.username}</span>
                    {isBanned(u.username) && <span className="text-[10px] px-2 py-0.5 rounded-full bg-red-500 text-white font-bold">🚫 已拉黑</span>}
                    <span className={`text-[10px] px-2 py-0.5 rounded-full font-semibold ${loginMethodColors[u.loginMethod] || 'bg-gray-100 text-gray-600 dark:bg-gray-800 dark:text-gray-400'}`}>
                      {loginMethodLabels[u.loginMethod] || '未知'}
                    </span>
                  </div>
                  <div className="text-xs text-gray-400 mt-0.5 truncate">
                    @{u.username}
                    {u.phone && ` · 📱 ${u.phone}`}
                    {u.wechatId && ` · 💬 ${u.wechatId}`}
                    {u.qqId && ` · 🐧 ${u.qqId}`}
                  </div>
                </div>
                {/* 操作按钮 */}
                <div className="flex gap-1.5 flex-shrink-0">
                  <button onClick={() => handleForceLogout(u)} title="强制下线"
                    className="px-3 py-1.5 rounded-lg text-xs font-semibold bg-amber-100 text-amber-700 hover:bg-amber-200 dark:bg-amber-900/30 dark:text-amber-300 dark:hover:bg-amber-900/50 transition-colors">
                    ⚡ 下线
                  </button>
                  <button onClick={() => handleToggleBan(u)} title={isBanned(u.username) ? '解封' : '拉黑'}
                    className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition-colors ${isBanned(u.username) ? 'bg-emerald-100 text-emerald-700 hover:bg-emerald-200 dark:bg-emerald-900/30 dark:text-emerald-300 dark:hover:bg-emerald-900/50' : 'bg-red-100 text-red-700 hover:bg-red-200 dark:bg-red-900/30 dark:text-red-300 dark:hover:bg-red-900/50'}`}>
                    {isBanned(u.username) ? '✅ 解封' : '🚫 拉黑'}
                  </button>
                  <button onClick={() => handleDeleteAccount(u)} title="删除账号"
                    className="px-3 py-1.5 rounded-lg text-xs font-semibold bg-gray-100 text-gray-600 hover:bg-gray-200 dark:bg-gray-800 dark:text-gray-400 dark:hover:bg-gray-700 transition-colors">
                    🗑️ 删除
                  </button>
                </div>
              </div>
            </div>
          ))}
        </div>
      )}

      {/* 详情弹窗 */}
      {detailUser && (
        <Modal open={true} onClose={() => setDetailUser(null)} title="账号详情">
          <div className="space-y-3 text-sm">
            <div><span className="text-gray-500">用户名：</span><span className="font-mono">{detailUser.username}</span></div>
            <div><span className="text-gray-500">显示名：</span>{detailUser.displayName}</div>
            <div><span className="text-gray-500">登录方式：</span>{loginMethodLabels[detailUser.loginMethod]}</div>
            {detailUser.phone && <div><span className="text-gray-500">手机号：</span>{detailUser.phone}</div>}
            {detailUser.wechatId && <div><span className="text-gray-500">微信：</span>{detailUser.wechatId}</div>}
            {detailUser.qqId && <div><span className="text-gray-500">QQ：</span>{detailUser.qqId}</div>}
            <div><span className="text-gray-500">状态：</span>{isBanned(detailUser.username) ? <span className="text-red-500 font-bold">🚫 已拉黑</span> : <span className="text-emerald-500 font-bold">✅ 正常</span>}</div>
          </div>
          <div className="flex gap-2 mt-5">
            <Button size="sm" onClick={() => { handleForceLogout(detailUser); setDetailUser(null); }}>⚡ 强制下线</Button>
            <Button size="sm" variant="danger" onClick={() => { handleToggleBan(detailUser); setDetailUser(null); }}>{isBanned(detailUser.username) ? '✅ 解封' : '🚫 拉黑'}</Button>
            <Button size="sm" variant="outline" onClick={() => setDetailUser(null)}>关闭</Button>
          </div>
        </Modal>
      )}
    </div>
  );
}
